id: nh3-cracking-screen-v1
pack: nh3_decomposition
version: 1
status: draft
description: Ammonia diluted in argon at 1 bar, a common lab comparison.
analyzer:
  name: Gas chromatograph
  measured: [NH3, H2, N2]
