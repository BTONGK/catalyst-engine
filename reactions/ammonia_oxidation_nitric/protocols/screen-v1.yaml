id: ost-screen-v1
pack: ammonia_oxidation_nitric
version: 1
status: draft
description: 10% ammonia with 18% oxygen in nitrogen, close to ammonia in air, at 1 atm and gauze-like contact times.
analyzer:
  name: FTIR
  measured: [NH3, NO, N2O]
  sigma_abs_ppm: 0.5
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: NO yield against temperature
    feed: {NH3: 10 %, O2: 18 %, N2: balance}
    ghsv_per_h: 500000
    temperatures_C: [500, 550, 600, 650, 700, 750, 800, 850, 900, 950]
