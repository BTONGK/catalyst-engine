id: hcn-screen-v1
pack: hcn_synthesis
version: 1
status: draft
description: "9.3% methane and 10.7% ammonia in argon at 1 atm: the starting mole fractions of Grabow et al.'s model (1 atm, 1373 K)."
analyzer:
  name: Gas chromatograph
  measured: [CH4, NH3, HCN, H2]
  sigma_abs_ppm: 20
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: HCN yield against temperature
    feed: {CH4: 9.3 %, NH3: 10.7 %, AR: balance}
    ghsv_per_h: 20000
    temperatures_C: [900, 950, 1000, 1050, 1100, 1150, 1200, 1250, 1300]
