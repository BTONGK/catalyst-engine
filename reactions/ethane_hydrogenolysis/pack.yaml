# Ethane hydrogenolysis. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (osmium) reaches half of the best possible result at 250 C under the screen protocol.

id: ethane_hydrogenolysis
name: Ethane hydrogenolysis
version: 1
status: draft-illustrative-parameters
summary: Cuts ethane's carbon-carbon bond with hydrogen to make methane, the classic test of how metals break C-C bonds.
category: Chemicals and fuels
description: >
  Ethane and hydrogen make two methanes. Equilibrium lies far toward methane at these temperatures. First order in
  ethane.

reference_temperature_K: 523.15

species:
  C2H6: {formula: C2H6}
  H2:   {formula: H2}
  CH4:  {formula: CH4}
  N2:   {formula: N2}

pathways:
  hydrogenolysis:
    equation: C2H6 + H2 -> 2 CH4
    role: desired
    rate: {key: C2H6, orders: {C2H6: 1}, ln_k_ref: 1.305, Ea_kJ: 150}

metrics:
  c2h6_conversion:
    kind: conversion
    species: [C2H6]
    description: "Share of the ethane split into methane."
  ch4_yield:
    kind: yield
    species: [CH4]
    denominator: [C2H6]
    description: "Methane made per ethane fed (2 is the most possible)."

screening:
  descriptor: {C: 1}
  pathways: [hydrogenolysis]
  metric: c2h6_conversion
  reference: {formula: Os, name: Osmium}
  optimum_shift_eV: 0.0
  peak_gas: {CH4: 1.0, H2: -2.0}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Os, Ru, Ni, Rh, Ir, Co, Re, Fe, Pt, Pd]
  # The reaction check (experiments/reaction_check) scores this ranking against Sinfelt's measured rates (metals
  # on silica, in Bond 2005): rho 0.10 over 5 metals, p 0.48, short of the rule; nickel ranks first there and
  # fourth here. The playground keeps it until a check passes (Manual, Methodology tab, limits).
  on_design_page: false
  basis: >
    The C-C bond breaks only after ethane has lost most of its hydrogen to the surface, so the rate follows how
    strongly a metal holds carbon: weak binders barely activate ethane, strong binders bury the surface under carbon
    (Sinfelt, J. Catal. 1967; Almithn and Hibbitts, J. Phys. Chem. C 2019). The descriptor is the carbon atom's
    binding; the top is set at osmium's, the most active metal in Sinfelt's measurements on silica.
