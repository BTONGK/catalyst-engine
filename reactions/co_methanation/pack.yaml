# CO methanation. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (cobalt) reaches half of the best possible result at 275 C under the screen protocol.

id: co_methanation
name: CO methanation
version: 1
status: draft-illustrative-parameters
summary: Turns carbon monoxide and hydrogen into methane, cleaning hydrogen for ammonia plants and making synthetic natural gas.
category: Hydrogen and energy
description: >
  CO reacts with hydrogen to make methane and water. The reaction gives off heat, so equilibrium favors low
  temperature. First order in CO, with the approach to equilibrium from thermodynamics.

reference_temperature_K: 548.15
water: H2O

species:
  CO:  {formula: CO}
  H2:  {formula: H2}
  CH4: {formula: CH4}
  H2O: {formula: H2O}
  N2:  {formula: N2}

pathways:
  methanation:
    equation: CO + 3 H2 <=> CH4 + H2O
    role: desired
    rate: {key: CO, orders: {CO: 1}, ln_k_ref: 1.335, Ea_kJ: 90}

metrics:
  co_conversion:
    kind: conversion
    species: [CO]
    description: "Share of the carbon monoxide turned into methane."
  ch4_yield:
    kind: yield
    species: [CH4]
    denominator: [CO]
    description: "Methane made per CO fed."
  co_out:
    kind: outlet
    species: [CO]
    description: "Carbon monoxide left; ammonia-plant hydrogen needs only a few ppm."

screening:
  descriptor: {C: 0.5, O: 0.5}
  pathways: [methanation]
  metric: co_conversion
  reference: {formula: Co, name: Cobalt}
  optimum_shift_eV: 0.0
  # the weak side waits on CO splitting into two atoms the descriptor counts: 0.9 eV of barrier per eV of
  # splitting energy (Nørskov et al., J. Catal. 2002), and that energy moves twice as fast as the descriptor
  slope_weak: 1.8
  peak_gas: {CO: 0.5}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Co, Ru, Ni, Fe, Rh, Re, Ir, Pd, Pt, Mo]
  # On the Design page since the reaction check (experiments/reaction_check) scored its ranking against Bligaard's
  # measured table: rho 0.69 over 8 metals, p 0.035. Cobalt and ruthenium tie at that table's top; cobalt, ahead in
  # Vannice's table, is the catalyst to beat and leaves the scoring, and ruthenium sits second in the predicted top
  # three (Re, Ru, Fe). Vannice's table gives rho 0.93, with ruthenium first in both its order and the prediction.
  on_design_page: true
  basis: >
    How strongly a metal holds carbon and oxygen, the two halves of a split CO, sets methanation rates (Bligaard et
    al., J. Catal. 2004). In the two laboratory series that map the metals, Bligaard's on alumina-stabilized
    magnesia and Vannice's on silica (J. Catal. 1977), cobalt and ruthenium come first and platinum, palladium and
    iridium last. The descriptor averages the C and O binding; the top is set at cobalt's, the metal both tables put
    at or near the top. On the weak side the rate waits on CO splitting into C and O. That barrier rises 0.9 eV per
    eV of splitting energy on metals (Nørskov et al., J. Catal. 2002), and the splitting energy adds the C and O
    binding, twice the descriptor, so the weak side falls 1.8 eV per eV of descriptor.
