id: h2o2d-screen-v1
pack: h2o2_decomposition
version: 1
status: draft
description: "Air carrying hydrogen peroxide vapor, as a sterilizer's exhaust does: 500 ppm H2O2 with 1% water in air, at 1 atm."
analyzer:
  name: Hydrogen peroxide vapor monitor
  measured: [H2O2]
  sigma_abs_ppm: 1
  sigma_rel: 0.03
steps:
  - id: screen
    purpose: Hydrogen peroxide conversion against temperature
    feed: {H2O2: 500 ppm, H2O: 1 %, O2: 20 %, N2: balance}
    ghsv_per_h: 30000
    temperatures_C: [20, 30, 40, 50, 60, 80, 100, 125, 150]
