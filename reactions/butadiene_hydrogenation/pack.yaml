# Selective hydrogenation of butadiene in butenes. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (palladium) reaches half of the best possible result at 60 C under the screen protocol.

id: butadiene_hydrogenation
name: Selective butadiene hydrogenation
version: 1
status: draft-illustrative-parameters
summary: Removes traces of 1,3-butadiene from butene streams before they become plastics and fuels, while sparing the butenes.
category: Chemicals and fuels
description: >
  Butadiene takes one hydrogen molecule to become butene; butene taking a second one to butane wastes the product.
  The pack lumps the butenes as 1-butene. First order in butadiene and in hydrogen for the desired path, and in
  butene and in hydrogen for the competing one, in a butene-rich stream (NASA Glenn data, since the C4 gases sit
  outside GRI-Mech).

reference_temperature_K: 333.15

species:
  C4H6:  {formula: C4H6, cantera: "C4H6,butadiene"}
  H2:    {formula: H2}
  C4H8:  {formula: C4H8, cantera: "C4H8,1-butene"}
  C4H10: {formula: C4H10, cantera: "C4H10,n-butane"}
  N2:    {formula: N2}

pathways:
  semihydrogenation:
    equation: C4H6 + H2 -> C4H8
    role: desired
    rate: {key: C4H6, orders: {C4H6: 1, H2: 1}, ln_k_ref: 0.626, Ea_kJ: 50}
  overhydrogenation:
    equation: C4H8 + H2 -> C4H10
    role: side
    note: "Butene hydrogenation; it destroys the product the plant sells."
    rate: {key: C4H8, orders: {C4H8: 1, H2: 1}, ln_k_ref: -8.000, Ea_kJ: 65}

metrics:
  c4h6_conversion:
    kind: conversion
    species: [C4H6]
    description: "Share of the butadiene removed."
  c4h6_out:
    kind: outlet
    species: [C4H6]
    description: "Butadiene left in the butenes."
  c4h8_gain:
    kind: yield
    species: [C4H8]
    denominator: [C4H6]
    description: "Butene gained per butadiene fed: 1 is fully selective, below zero means butene lost."

screening:
  descriptor: {C: 0.25}
  pathways: [semihydrogenation]
  metric: c4h6_conversion
  reference: {formula: Pd, name: Palladium}
  optimum_shift_eV: 0.0
  peak_gas: {}   # the reaction's gases hold none its adsorbates exchange with; the top holds still
  suggested_elements: [Pd, Pt, Ni, Cu, Au, Ag, Co, Rh]
  # Kept to the library and the Catalyst playground: its check needs a per-metal table measured in one
  # laboratory, and the sources reached so far give none (Manual, Methodology tab, limits).
  on_design_page: false
  basis: >
    Butadiene, like acetylene, holds to a metal far more strongly than the alkene it becomes, so a good catalyst
    hydrogenates it and lets the butene go. Palladium does this best: among the noble metals it gives butenes alone
    while butadiene remains (Bond et al., J. Chem. Soc. 1965; Wells and Bates, J. Chem. Soc. A 1968). As for
    acetylene (Studt et al., Science 2008), the descriptor is a quarter of the carbon binding, like a methyl group;
    the top is set at palladium's, the industrial catalyst.
