id: methanation-screen-v1
pack: co2_methanation
version: 1
status: draft
description: Stoichiometric CO2 and hydrogen, diluted in nitrogen, at 1 bar.
analyzer:
  name: Gas chromatograph
  measured: [CO2, CH4, H2]
  sigma_abs_ppm: 50
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: CO2 conversion against temperature
    feed: {CO2: 10 %, H2: 40 %, N2: balance}
    ghsv_per_h: 10000
    temperatures_C: [150, 200, 250, 300, 350, 400, 450, 500, 550]
