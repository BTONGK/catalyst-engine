# Catalytic hydrogen combustion. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (platinum) reaches half of the best possible result at 75 C under the screen protocol.

id: hydrogen_combustion
name: Catalytic hydrogen combustion
version: 1
status: draft-illustrative-parameters
summary: Burns hydrogen in air on a catalyst far below its ignition temperature, as the passive recombiners of nuclear plants and catalytic heaters do.
category: Hydrogen and energy
description: >
  Hydrogen and oxygen make water, and equilibrium lies fully toward water at every temperature of the screen. First
  order in hydrogen, with oxygen in excess.

reference_temperature_K: 348.15
water: H2O
oxygen: O2

species:
  H2:  {formula: H2}
  O2:  {formula: O2}
  H2O: {formula: H2O}
  N2:  {formula: N2}

pathways:
  combustion:
    equation: H2 + 0.5 O2 -> H2O
    role: desired
    rate: {key: H2, orders: {H2: 1}, ln_k_ref: 2.504, Ea_kJ: 40}

metrics:
  h2_conversion:
    kind: conversion
    species: [H2]
    description: "Share of the hydrogen burned."
  h2_out:
    kind: outlet
    species: [H2]
    description: "Hydrogen left in the air; air with more than 4% hydrogen can ignite."

screening:
  descriptor: {O: 1}
  pathways: [combustion]
  metric: h2_conversion
  reference: {formula: Pt, name: Platinum}
  optimum_shift_eV: 0.0
  # the weak side waits on O2 splitting into two atoms the descriptor counts: 0.9 eV of barrier per eV of
  # splitting energy (Nørskov et al., J. Catal. 2002), and that energy moves twice as fast as the descriptor
  slope_weak: 1.8
  peak_gas: {O2: 0.5}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Pt, Pd, Rh, Ir, Ru, Ni, Co, Cu, Ag, Au]
  # the reaction check's verdict (experiments/reaction_check, PASS_RULE.md); tests/test_checks.py ties them
  check: awaiting
  check_note: >
    Its ranking awaits a table of rates measured on several metals in one laboratory.
  basis: >
    Hydrogen splits readily on the platinum metals, so the oxygen side sets the rate: the surface has to split O2
    and pass its oxygen atoms to hydrogen, through OH, to leave as water (Völkening et al., Phys. Rev. Lett. 1999,
    on platinum). Oxygen binding sorts the metals. The descriptor is oxygen binding; the top is set at platinum's,
    which with palladium is the catalyst of the passive recombiners in nuclear plants, and the weak side falls 1.8
    eV per eV for O2 splitting.
