id: h2c-screen-v1
pack: hydrogen_combustion
version: 1
status: draft
description: "Air carrying hydrogen below its flammability limit: 2% hydrogen with 20% oxygen in nitrogen, at 1 atm."
analyzer:
  name: Gas chromatograph
  measured: [H2, O2]
  sigma_abs_ppm: 20
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: Hydrogen conversion against temperature
    feed: {H2: 2 %, O2: 20 %, N2: balance}
    ghsv_per_h: 50000
    temperatures_C: [25, 50, 75, 100, 125, 150, 200, 250, 300]
