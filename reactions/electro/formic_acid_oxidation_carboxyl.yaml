# Formic acid oxidation through carboxyl: HCOOH -> CO2 + 2 (H+ + e-), the second direct route, through COOH* bound
# through carbon (Elnabawy et al., J. Electrochem. Soc. 165, J3109 (2018), which computes both direct routes).

id: formic_acid_oxidation_carboxyl
name: Formic acid oxidation (carboxyl route)
category: Hydrogen and energy
summary: Oxidizes formic acid to CO2 through carboxyl, the second direct route beside the formate one.
equation: HCOOH -> CO2 + 2 H+ + 2 e-
direction: oxidation
electrons: 2
equilibrium_V: -0.114       # from dissolved formic acid, from tabulated formation free energies
compare_V: 0.30
# Correction: Peterson et al. 2010's value as Hansen et al. 2013, Table S1, reproduces it
#   (experiments/reaction_check/data/published.yaml).
# shift: this reaction's zero is dissolved formic acid, 0.021 eV above CO(g) and water, COOH*'s starting scale.
intermediates:
  - {name: COOH, label: "carboxyl (COOH*)", correction_eV: 0.91, shift_eV: -0.021}
descriptor: {COOH: 1}
# the two steps at 0 V as lines in x = G(COOH*): HCOOH -> COOH* is x, COOH* -> CO2 is -0.228 - x
volcano_steps: [[1, 0], [-1, -0.228]]
reference: {formula: Pd, name: Palladium}
task: oc20
suggested_elements: [Pd, Pt, Au, Ag, Ir, Rh, Ru, Cu, Ni, Bi]
# On the Design page since the reaction check (experiments/reaction_check: PASS_RULE.md, results/summary.json):
#   its limiting potentials order the 12 metals of Elnabawy 2018's table with rho 0.77 (p 0.002), through COOH*,
#   which passes its own check against the same table.
on_design_page: true
basis: >
  Formic acid can give up the hydrogen on its carbon first and sit on the surface as carboxyl, COOH*, bound through
  carbon; the hydrogen on its oxygen then leaves as a second proton and electron, and CO2 leaves. The formate route
  beside it breaks the O-H bond first and goes through OCHO*. On each metal the route whose intermediate sits
  closer to the ideal carries the current, and Elnabawy et al. 2018 compute both on twelve metals. Compare this
  file with the formate route on the same metal: the faster of the two sets the rate. CO*, which poisons platinum,
  forms on a third, indirect route that both direct routes keep clear of.
