# Methanol oxidation to formic acid (formate in alkaline electrolyte): CH3OH + H2O -> HCOOH + 4 (H+ + e-), through
# CH2OH*, CHOH* and CHO*, with formyl taking the oxygen of water (intermediates of Ferrin and Mavrikakis, J. Am.
# Chem. Soc. 131, 14381 (2009)).

id: methanol_to_formate
name: Methanol oxidation to formate
category: Chemicals
summary: Oxidizes methanol to formic acid or formate, a chemical worth more than the oxygen an anode usually makes.
equation: CH3OH + H2O -> HCOOH + 4 H+ + 4 e-
direction: oxidation
electrons: 4
equilibrium_V: 0.104        # from dissolved methanol to dissolved formic acid, from tabulated formation free energies
compare_V: 0.60
# Corrections: UMA's own vibrations on Pt(111) (results/corrections.json), which the pages mark as UMA's own.
# shift: each intermediate starts against CO(g), H2O and H2; this reaction's zero is dissolved methanol and liquid
#   water, 0.395 eV below CO + H2O + 2 H2.
intermediates:
  - {name: CH2OH, label: "hydroxymethyl (CH2OH*)", correction_eV: 1.56, shift_eV: 0.3953, correction_from: uma}
  - {name: CHOH, label: "hydroxymethylene (CHOH*)", correction_eV: 1.25, shift_eV: 0.3953, correction_from: uma}
  - {name: CHO, label: "formyl (CHO*)", correction_eV: 0.82, shift_eV: 0.3953, correction_from: uma}
descriptor: {CHO: 1}
reference: {formula: Pt, name: Platinum}
task: oc20
suggested_elements: [Pt, Pd, Au, Ag, Cu, Ni, Rh, Ir, Ru, Co]
# the reaction check's verdict (experiments/reaction_check, PASS_RULE.md); tests/test_checks.py ties them
check: awaiting
check_note: >
  CH2OH*, CHOH* and CHO* each pass their check against Ferrin 2009; the ranking awaits published free energies on
  the hydrogen-electrode scale and published zero-point and entropy corrections for all three.
basis: >
  Oxidizing methanol to formic acid, or to formate in alkaline electrolyte, makes a chemical worth more than the
  oxygen an electrolyzer's anode usually makes, at a lower potential. Methanol gives up the hydrogens on its carbon
  first, through hydroxymethyl, CH2OH*, and hydroxymethylene, CHOH*. There the routes part: the second hydrogen on
  carbon leads to COH* and CO*, the methanol-oxidation file's route, while the hydrogen on oxygen leaves formyl,
  CHO*, which takes the oxygen of water and leaves as formic acid, four electrons in all. In alkaline electrolyte
  nickel's oxidized surface makes formate at high selectivity, an oxide the metal screen here leaves to experiment.
