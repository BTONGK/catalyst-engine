# Ammonia oxidation to nitrogen: per ammonia molecule, NH3 -> 1/2 N2 + 3 (H+ + e-), through NH2*, NH* and N*, then
# two N* pairing up as N2 (the N + N route of Herron, Ferrin and Mavrikakis, J. Phys. Chem. C 119, 14692 (2015)).

id: ammonia_oxidation
name: Ammonia oxidation to nitrogen (AOR)
category: Nitrogen
summary: Oxidizes ammonia to nitrogen at the anode of a direct ammonia fuel cell or an ammonia electrolyzer.
equation: NH3 -> 1/2 N2 + 3 H+ + 3 e-
direction: oxidation
electrons: 3
equilibrium_V: 0.057        # from NH3 gas, from tabulated formation free energies
compare_V: 0.60
# Corrections: Skúlason 2012's constants for NH2*, NH* and N* (its eqs. 29-32; see nitrogen_reduction.yaml).
# shift: each intermediate starts against N2 and H2; this reaction's zero is NH3, 0.1705 eV below 1/2 N2 + 3/2 H2.
intermediates:
  - {name: NH2, label: "amide (NH2*)", correction_eV: 0.88, shift_eV: 0.1705}
  - {name: NH, label: "imide (NH*)", correction_eV: 0.57, shift_eV: 0.1705}
  - {name: N, label: "adsorbed nitrogen (N*)", correction_eV: 0.26, shift_eV: 0.1705}
route: "Down to N*, then N2"
# N* + N* -> N2 moves no electron. Herron 2015 (Table 3) gives its barrier on six metals, 1.16-2.55 eV, scattered
#   0.26 eV around a line in N binding, beyond the 0.15 eV error bar, so the step counts its free energy only.
chemical_steps:
  - {step: 3, label: "two N* pair up and leave as N2"}
descriptor: {N: 1}
reference: {formula: Pt, name: Platinum}
task: oc20
suggested_elements: [Pt, Ir, Pd, Rh, Ru, Cu, Ni, Co, Au, Ag]
on_design_page: false
design_note: UMA's N* binding misses Herron 2015's DFT table by 0.26 eV in typical size, beyond the 0.20 eV the rule allows
basis: >
  Ammonia gives up its three hydrogens one proton and electron at a time, through NH2* and NH* to N*, and two N*
  then pair up and leave as N2. On platinum the last hydrogen, NH* to N*, is the hardest, which sets the onset
  near 0.5 V (Herron et al. 2015). Metals that bind nitrogen strongly reach N* easily but hold it, and N* covers the
  surface; those that bind it weakly struggle to strip the hydrogens. Pairing N* atoms has a high barrier on every
  metal Herron computed, and platinum and iridium lead in experiment through a second route in which partly
  stripped NHx groups pair first; both are in the Methodology tab's limits.
