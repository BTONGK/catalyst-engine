# Hydrogen peroxide reduction: H2O2 + 2 (H+ + e-) -> 2 H2O through OH* (the last two steps of the four-electron
# oxygen reduction path; Nørskov et al., J. Phys. Chem. B 108, 17886 (2004)).

id: h2o2_reduction
name: Hydrogen peroxide reduction
category: Chemicals
summary: Reduces hydrogen peroxide to water, the cathode of peroxide fuel cells and the reaction in peroxide sensors.
equation: H2O2 + 2 H+ + 2 e- -> 2 H2O
direction: reduction
electrons: 2
equilibrium_V: 1.763        # H2O2(aq)/H2O, from tabulated formation free energies
compare_V: 0.60
# OH*: the oxygen-reduction file's three terms (Nørskov 2004): +0.35 eV for zero-point energy and entropy, -0.33 eV
#   for the hydrogen bonds from liquid water and -0.27 eV for those within the OH layer at a third of a monolayer.
#   Removing OH* is the last step of both reactions and sets in at the same potentials on platinum, near 0.8 V, so
#   both files place OH* alike.
intermediates:
  - {name: OH, label: "hydroxyl (OH*)", correction_eV: 0.35, water_eV: -0.33, layer_eV: -0.27}
descriptor: {OH: 1}
# the two steps at 0 V as lines in x = G(OH*): H2O2 -> OH* + H2O is x - 3.526, OH* -> H2O is -x
volcano_steps: [[1, -3.526], [-1, 0]]
reference: {formula: Pt, name: Platinum}
task: oc20
suggested_elements: [Pt, Pd, Au, Ag, Ir, Rh, Ru, Cu, Ni, Co]
# On the Design page since the reaction check (experiments/reaction_check: PASS_RULE.md, results/summary.json):
#   its limiting potentials order the 13 metals of
#   Nørskov 2004's Table 2 with rho 0.97 (p < 0.001), through OH*, which the oxygen-reduction check covers.
on_design_page: true
basis: >
  Hydrogen peroxide takes a proton and electron and splits, leaving OH* and a water molecule; OH* takes a second
  proton and electron to become water. These are the last two steps of four-electron oxygen reduction, so OH*
  binding is the descriptor and every metal that binds OH* tighter than about 1.76 eV in free energy is limited
  by the last step, removing OH*, as in oxygen reduction (Nørskov et al. 2004). Peroxide also falls apart on many
  surfaces into water and oxygen by itself, at zero current, a side reaction this free-energy path leaves to experiment.
