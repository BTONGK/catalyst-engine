# CO electro-oxidation: CO + H2O -> CO2 + 2 (H+ + e-). CO lands on the surface, takes the oxygen of water to become
# COOH*, and leaves as CO2 (the carboxyl path, CO2 reduction to CO run backwards; Hansen et al., J. Phys. Chem. Lett.
# 4, 388 (2013) for the intermediates).

id: co_oxidation_electro
name: CO electro-oxidation
category: Hydrogen and energy
summary: Oxidizes carbon monoxide to CO2 at an anode, the reaction that sets how well a fuel cell tolerates CO.
equation: CO + H2O -> CO2 + 2 H+ + 2 e-
direction: oxidation
electrons: 2
equilibrium_V: -0.104       # from CO(g) and liquid water, from tabulated formation free energies
compare_V: 0.60
# Corrections: Peterson et al. 2010's values as Hansen et al. 2013, Table S1, reproduces them
#   (experiments/reaction_check/data/published.yaml).
# shift: CO* and COOH* start against CO(g), H2O and H2, this reaction's own start, so both shifts are 0.
intermediates:
  - {name: CO, label: "adsorbed CO (CO*)", correction_eV: 0.50}
  - {name: COOH, label: "carboxyl (COOH*)", correction_eV: 0.91}
chemical_steps:
  - {step: 0, label: "CO lands on the surface"}
descriptor: {CO: 1}
reference: {formula: Pt, name: Platinum}
task: oc20
suggested_elements: [Pt, Ru, Pd, Rh, Ir, Os, Au, Ag, Cu, Ni]
on_design_page: false
design_note: CO* misses its check against Elnabawy 2018
basis: >
  CO oxidation decides how well a fuel-cell anode tolerates the CO that reformed hydrogen and methanol leave on
  it. CO lands on the surface, a step that moves zero electrons; CO* then takes the oxygen of a water molecule and
  gives up a proton and electron to become carboxyl, COOH*, which gives up a second and leaves as CO2. Platinum
  holds CO* tightly and clears it near 0.7 V; ruthenium beside platinum brings OH* at lower potential, the reason
  platinum-ruthenium anodes tolerate CO. This file follows the carboxyl path; the route in which CO* meets an OH*
  formed beside it (Gilman's reactant pair) is in the Methodology tab's limits.
