# CO reduction to methane: CO + 6 (H+ + e-) -> CH4 + H2O. CO lands on the surface, then follows the methane path of
# CO2 reduction from CO* on, through CHO*, CH2O* and CH3O*, then O* and OH* (Peterson et al., Energy Environ. Sci. 3,
# 1311 (2010); Peterson and Nørskov, J. Phys. Chem. Lett. 3, 251 (2012)).

id: co_to_methane
name: CO reduction to methane
category: CO2 conversion
summary: Turns carbon monoxide into methane with electricity, the second stage of a two-step CO2 electrolyzer.
equation: CO + 6 H+ + 6 e- -> CH4 + H2O
direction: reduction
electrons: 6
equilibrium_V: 0.260        # to methane gas and liquid water, from tabulated formation free energies
compare_V: -1.00
# Corrections: CO* takes Peterson et al. 2010's value as Hansen et al. 2013, Table S1, reproduces it
#   (experiments/reaction_check/data/published.yaml); CHO*, CH2O* and CH3O* take UMA's own vibrations on Pt(111)
#   (results/corrections.json), which the pages mark as UMA's own; O* and OH* take the CO2-to-methane
#   file's terms.
# shift: the carbon intermediates start against CO(g) and H2; this reaction's zero is methane and liquid water,
#   1.562 eV below CO + 3 H2. O* and OH* start against water and H2, and with the methane already made they sit on
#   the zero's own scale.
intermediates:
  - {name: CO, label: "adsorbed CO (CO*)", correction_eV: 0.50, shift_eV: 1.5617}
  - {name: CHO, label: "formyl (CHO*)", correction_eV: 0.82, shift_eV: 1.5617, correction_from: uma}
  - {name: CH2O, label: "formaldehyde (CH2O*)", correction_eV: 1.20, shift_eV: 1.5617, correction_from: uma}
  - {name: CH3O, label: "methoxy (CH3O*)", correction_eV: 1.55, shift_eV: 1.5617, correction_from: uma}
  - {name: O, label: "adsorbed oxygen (O*)", correction_eV: 0.05}
  - {name: OH, label: "hydroxyl (OH*)", correction_eV: 0.35, water_eV: -0.33}
chemical_steps:
  - {step: 0, label: "CO lands on the surface"}
descriptor: {CO: 1}
reference: {formula: Cu, name: Copper}
task: oc20
suggested_elements: [Cu, Au, Ag, Zn, Pd, Pt, Ni, Rh, Ir, Ru]
# the reaction check's verdict (experiments/reaction_check, PASS_RULE.md); tests/test_checks.py ties them
check: missed
check_note: >
  UMA's CO* binding orders Elnabawy 2018's metals with rho 0.56, below the 0.6 the rule asks; CH2O* awaits a
  published table; and the ranking awaits published free energies on the hydrogen-electrode scale and published
  corrections for CHO*, CH2O* and CH3O*.
basis: >
  CO reduction is the second stage of a two-step CO2 electrolyzer: a first cell makes CO, and a copper cathode
  turns it into methane, ethylene and alcohols. CO lands on the surface, a step that moves zero electrons, and then
  follows the methane path of CO2 reduction from CO* on (Peterson et al. 2010): formyl, CHO*, formaldehyde, CH2O*,
  and methoxy, CH3O*; then methane leaves, and O* turns into water through OH*. Protonating CO* to CHO* is the hard
  step on copper, as in CO2 reduction (Peterson and Nørskov 2012). On copper most of the current goes to ethylene
  and other C2 products, which form when two carbon intermediates join, a step beyond this one-carbon path.
