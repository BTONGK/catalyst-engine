id: mdc-screen-v1
pack: methanol_decomposition
version: 1
status: draft
description: 5% methanol vapor in nitrogen, at 1 atm.
analyzer:
  name: Gas chromatograph
  measured: [CH3OH, CO, H2]
  sigma_abs_ppm: 20
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: Methanol conversion against temperature
    feed: {CH3OH: 5 %, N2: balance}
    ghsv_per_h: 10000
    temperatures_C: [150, 175, 200, 225, 250, 275, 300, 350, 400]
