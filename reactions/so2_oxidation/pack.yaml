# SO2 oxidation to SO3, the contact process. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (platinum) reaches half of the best possible result at 450 C under the screen protocol.

id: so2_oxidation
name: SO2 oxidation (contact process)
version: 1
status: draft-illustrative-parameters
summary: Turns sulfur dioxide into sulfur trioxide, the step that makes sulfuric acid, the chemical made in the largest tonnage worldwide.
category: Chemicals and fuels
description: >
  SO2 and oxygen make SO3. The reaction gives off heat, so equilibrium caps the SO3 share at the hot end, which is
  why plants cool the gas between catalyst beds. First order in SO2, with the approach to equilibrium from
  thermodynamics (NASA Glenn data, since the sulfur oxides sit outside GRI-Mech).

reference_temperature_K: 723.15
oxygen: O2

species:
  SO2: {formula: SO2}
  O2:  {formula: O2}
  SO3: {formula: SO3}
  N2:  {formula: N2}

pathways:
  oxidation:
    equation: SO2 + 0.5 O2 <=> SO3
    role: desired
    rate: {key: SO2, orders: {SO2: 1}, ln_k_ref: 0.897, Ea_kJ: 80}

metrics:
  so2_conversion:
    kind: conversion
    species: [SO2]
    description: "Share of the SO2 turned into SO3."
  so2_out:
    kind: outlet
    species: [SO2]
    description: "SO2 left in the gas."

screening:
  descriptor: {O: 1}
  pathways: [oxidation]
  metric: so2_conversion
  reference: {formula: Pt, name: Platinum}
  optimum_shift_eV: 0.0
  # the weak side waits on O2 splitting into two atoms the descriptor counts: 0.9 eV of barrier per eV of
  # splitting energy (Nørskov et al., J. Catal. 2002), and that energy moves twice as fast as the descriptor
  slope_weak: 1.8
  peak_gas: {O2: 0.5}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Pt, Pd, Rh, Ir, Ru, Ag, Au, Cu]
  # Kept to the library and the Catalyst playground: its check needs a per-metal table measured in one
  # laboratory, and the sources reached so far give none (Manual, Methodology tab, limits).
  on_design_page: false
  basis: >
    Platinum ran the first contact plants; vanadium oxide, cheaper and tougher against arsenic, replaced it (Müller,
    Ullmann's Encyclopedia of Industrial Chemistry, Sulfuric Acid and Sulfur Trioxide). On platinum the surface
    splits O2 and its oxygen atoms join adsorbed SO2 (Lin, Schneider and Trout, J. Phys. Chem. B 2004), so oxygen
    binding sorts the metals. The descriptor is oxygen binding; the top is set at platinum's, and the weak side
    falls 1.8 eV per eV for O2 splitting. Vanadium oxide, an oxide, sits outside this screen of metals.
