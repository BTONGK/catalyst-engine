# Oxidation catalyst for lean-burn gas engines (the analysis's product #2): CO,
# formaldehyde and methane oxidation, plus NO -> NO2, which is equilibrium-limited
# at high temperature. Runs on the same flow rig and FTIR as scr_hot.
#
# Rate parameters are ILLUSTRATIVE defaults, not measurements of any product.

id: oxidation_engine
name: Gas-engine oxidation catalyst (CO, HCHO, CH4, NO)
version: 1
status: draft-illustrative-parameters
summary: Burns carbon monoxide, formaldehyde and methane in the exhaust of natural-gas engines.
category: Clean air
description: >
  Formaldehyde must leave at or below 14 ppmvd @ 15% O2 across 450-1,350 F catalyst
  inlet temperatures. CO oxidation follows a Voltz-type law (self-inhibited by CO).

reference_temperature_F: 800
water: H2O
oxygen: O2

species:
  CO:   {formula: CO}
  CO2:  {formula: CO2}
  HCHO: {formula: CH2O, cantera: CH2O}
  CH4:  {formula: CH4}
  NO:   {formula: NO}
  NO2:  {formula: NO2}
  O2:   {formula: O2}
  H2O:  {formula: H2O}
  N2:   {formula: N2}

pathways:
  co_ox:
    equation: CO + 0.5 O2 -> CO2
    role: desired
    rate:
      key: CO
      orders: {CO: 1}
      inhibition:
        CO: {ln_K_ref: 4.6, dH_kJ: -30}
      inhibition_exponent: 2
      ln_k_ref: 6.2
      Ea_kJ: 80
  hcho_ox:
    equation: HCHO + O2 -> CO2 + H2O
    role: desired
    rate: {key: HCHO, orders: {HCHO: 1}, ln_k_ref: 5.7, Ea_kJ: 60}
  ch4_ox:
    equation: CH4 + 2 O2 -> CO2 + 2 H2O
    role: desired
    rate: {key: CH4, orders: {CH4: 1}, ln_k_ref: 1.1, Ea_kJ: 120}
  no_ox:
    equation: NO + 0.5 O2 <=> NO2
    role: side
    note: Reversible; equilibrium from thermodynamics caps NO2 at high temperature.
    rate: {key: NO, orders: {NO: 1, O2: 0.5}, ln_k_ref: 3.0, Ea_kJ: 40}

metrics:
  co_conversion:   {kind: conversion, species: [CO], description: Share of carbon monoxide oxidized.}
  hcho_conversion: {kind: conversion, species: [HCHO], description: Share of formaldehyde oxidized.}
  ch4_conversion:  {kind: conversion, species: [CH4], description: Share of methane oxidized (the hardest of the three).}
  hcho_out:
    kind: outlet
    species: [HCHO]
    basis: {dry: true, o2_ref_pct: 15}
    description: Formaldehyde leaving the catalyst. The federal engine rule allows up to 14 ppmvd @ 15% O2.
    target: {max: 14.0, label: Engine rule}
  co_out:
    kind: outlet
    species: [CO]
    basis: {dry: true, o2_ref_pct: 15}
    description: Carbon monoxide leaving the catalyst, on the permit basis.
  no2_out:
    kind: outlet
    species: [NO2]
    basis: {dry: true, o2_ref_pct: 15}
    description: NO2 formed over the catalyst; thermodynamics caps it at high temperature.

screening:
  descriptor: {O: 1}
  pathways: [co_ox, hcho_ox, ch4_ox]
  metric: hcho_conversion
  reference: {formula: Pt, name: Platinum}
  optimum_shift_eV: 0.2
  suggested_elements: [Pt, Pd, Rh, Ir, Ru, Au, Ag, Cu, Co, Mn]
  basis: >
    Oxygen binding sets oxidation activity on metals (Falsig et al., Angew. Chem. 2008): metals that hold oxygen
    too tightly stay covered, metals that hold it too loosely leave O2 unsplit. Platinum sits a little on the
    tight side, so the top is set 0.2 eV weaker than platinum's. Methane oxidation follows its own volcano, with
    palladium oxide on top, so read the methane column as a first pass.
