id: noco-screen-v1
pack: no_co_reduction
version: 1
status: draft
description: "Stoichiometric petrol exhaust reduced to its NO, CO and CO2: 1000 ppm NO, 1% CO and 10% CO2 in nitrogen, at 1 atm."
analyzer:
  name: FTIR
  measured: [NO, CO, N2O, CO2]
  sigma_abs_ppm: 0.5
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: NO conversion against temperature
    feed: {NO: 1000 ppm, CO: 1 %, CO2: 10 %, N2: balance}
    ghsv_per_h: 50000
    temperatures_C: [150, 200, 250, 300, 350, 400, 450, 500]
