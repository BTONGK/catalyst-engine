# NO reduction by CO, the three-way catalyst's NOx step. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (rhodium) reaches half of the best possible result at 300 C under the screen protocol.

id: no_co_reduction
name: NO reduction by CO
version: 1
status: draft-illustrative-parameters
summary: Strips NO from petrol-engine exhaust with the exhaust's own CO, the job of rhodium in every three-way converter.
category: Clean air
description: >
  NO and CO make nitrogen and CO2; a competing path stops at nitrous oxide. Each is first order in NO.

reference_temperature_K: 573.15

species:
  NO:  {formula: NO}
  CO:  {formula: CO}
  N2:  {formula: N2}
  CO2: {formula: CO2}
  N2O: {formula: N2O}

pathways:
  reduction:
    equation: 2 NO + 2 CO -> N2 + 2 CO2
    role: desired
    rate: {key: NO, orders: {NO: 1}, ln_k_ref: 2.999, Ea_kJ: 80}
  to_n2o:
    equation: 2 NO + CO -> N2O + CO2
    role: side
    note: "Stops at nitrous oxide, a strong greenhouse gas, mostly at the cool end."
    rate: {key: NO, orders: {NO: 1}, ln_k_ref: -2.000, Ea_kJ: 50}

metrics:
  no_conversion:
    kind: conversion
    species: [NO]
    description: "Share of the NO removed."
    target: {min: 0.9, label: Target}
  n2o_out:
    kind: outlet
    species: [N2O]
    description: "Nitrous oxide made."

screening:
  descriptor: {N: 0.5, O: 0.5}
  pathways: [reduction]
  metric: no_conversion
  reference: {formula: Rh, name: Rhodium}
  optimum_shift_eV: 0.0
  # the weak side waits on NO splitting into two atoms the descriptor counts: 0.9 eV of barrier per eV of
  # splitting energy (Nørskov et al., J. Catal. 2002), and that energy moves twice as fast as the descriptor
  slope_weak: 1.8
  peak_gas: {N2: 0.25, CO2: 0.5, CO: -0.5}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Rh, Pd, Pt, Ir, Ru, Co, Ni, Cu]
  # Kept to the library and the Catalyst playground: its check needs a per-metal table measured in one
  # laboratory, and the sources reached so far give none (Manual, Methodology tab, limits).
  on_design_page: false
  basis: >
    NO splits on the surface, and the N and O atoms leave as N2 and CO2, so nitrogen and oxygen binding together set
    the rate; rhodium does this best among the converter metals (Shelef and Graham, Catal. Rev. 1994). The
    descriptor averages the N and O binding; the top is set at rhodium's. On the weak side the rate waits on NO
    splitting, whose energy adds the N and O binding, twice the descriptor, so the weak side falls 1.8 eV per eV
    (Nørskov et al., J. Catal. 2002).
