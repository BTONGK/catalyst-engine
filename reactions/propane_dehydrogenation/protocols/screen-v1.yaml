id: pdh-screen-v1
pack: propane_dehydrogenation
version: 1
status: draft
description: 20% propane with 5% hydrogen in nitrogen, at 1 atm.
analyzer:
  name: Gas chromatograph
  measured: [C3H8, C3H6, CH4, C2H4, H2]
  sigma_abs_ppm: 20
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: Propylene yield against temperature
    feed: {C3H8: 20 %, H2: 5 %, N2: balance}
    ghsv_per_h: 5000
    temperatures_C: [450, 475, 500, 525, 550, 575, 600, 625, 650, 675, 700]
