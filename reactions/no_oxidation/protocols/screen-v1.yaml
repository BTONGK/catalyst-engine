id: nox-screen-v1
pack: no_oxidation
version: 1
status: draft
description: "Diesel exhaust: 500 ppm NO with 8% oxygen and 5% water in nitrogen, at 1 atm."
analyzer:
  name: FTIR
  measured: [NO, NO2]
  sigma_abs_ppm: 0.5
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: NO conversion against temperature
    feed: {NO: 500 ppm, O2: 8 %, H2O: 5 %, N2: balance}
    ghsv_per_h: 50000
    temperatures_C: [100, 150, 200, 250, 300, 350, 400, 450, 500]
