id: mox-screen-v1
pack: methane_combustion
version: 1
status: draft
description: "Gas-engine exhaust: 0.5% methane with 10% oxygen and 5% water in nitrogen, at 1 atm."
analyzer:
  name: FTIR
  measured: [CH4, CO2]
  sigma_abs_ppm: 0.5
  sigma_rel: 0.02
steps:
  - id: screen
    purpose: Methane light-off
    feed: {CH4: 0.5 %, O2: 10 %, H2O: 5 %, N2: balance}
    ghsv_per_h: 50000
    temperatures_C: [200, 250, 300, 350, 400, 450, 500, 550, 600, 650]
