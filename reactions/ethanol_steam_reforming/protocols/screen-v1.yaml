id: esr-screen-v1
pack: ethanol_steam_reforming
version: 1
status: draft
description: 5% ethanol with 30% steam in nitrogen, a water-to-ethanol ratio of six, at 1 atm.
analyzer:
  name: Gas chromatograph
  measured: [C2H5OH, CO2, CO, CH4, H2]
  sigma_abs_ppm: 20
  sigma_rel: 0.02
steps:
