# Formaldehyde oxidation. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (platinum) reaches half of the best possible result at 60 C under the screen protocol.

id: formaldehyde_oxidation
name: Formaldehyde oxidation
version: 1
status: draft-illustrative-parameters
summary: Burns formaldehyde, a common indoor air pollutant, at room temperature in air purifiers.
category: Clean air
description: >
  Formaldehyde and oxygen make CO2 and water. First order in formaldehyde.

reference_temperature_K: 333.15
water: H2O
oxygen: O2

species:
  CH2O: {formula: CH2O}
  O2:   {formula: O2}
  CO2:  {formula: CO2}
  H2O:  {formula: H2O}
  N2:   {formula: N2}

pathways:
  oxidation:
    equation: CH2O + O2 -> CO2 + H2O
    role: desired
    rate: {key: CH2O, orders: {CH2O: 1}, ln_k_ref: 2.463, Ea_kJ: 50}

metrics:
  hcho_conversion:
    kind: conversion
    species: [CH2O]
    description: "Share of the formaldehyde removed."
    target: {min: 0.9, label: Target}
  hcho_out:
    kind: outlet
    species: [CH2O]
    description: "Formaldehyde left in the air."

screening:
  descriptor: {O: 1}
  pathways: [oxidation]
  metric: hcho_conversion
  reference: {formula: Pt, name: Platinum}
  optimum_shift_eV: 0.0
  # the weak side waits on O2 splitting into two atoms the descriptor counts: 0.9 eV of barrier per eV of
  # splitting energy (Nørskov et al., J. Catal. 2002), and that energy moves twice as fast as the descriptor
  slope_weak: 1.8
  peak_gas: {O2: 0.5}   # gases its adsorbates exchange with; the top follows them
  suggested_elements: [Pt, Pd, Rh, Au, Ag, Ir, Ru, Co]
  # the reaction check's verdict (experiments/reaction_check, PASS_RULE.md); tests/test_checks.py ties them
  check: awaiting
  check_note: >
    Its ranking awaits a table of rates measured on several metals in one laboratory.
  basis: >
    Platinum burns formaldehyde through formate at room temperature (Zhang et al., Appl. Catal. B 2006): the surface
    has to split O2 and clear the formate, so oxygen binding sets the rate, as in CO oxidation. The descriptor is
    oxygen binding; the top is set at platinum's, and the weak side falls 1.8 eV per eV for O2 splitting.
