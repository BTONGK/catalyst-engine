# Benzene hydrogenation. Rate parameters are ILLUSTRATIVE: the screened rate constant is set so the catalyst to beat
# (osmium) reaches half of the best possible result at 100 C under the screen protocol.

id: benzene_hydrogenation
name: Benzene hydrogenation
version: 1
status: draft-illustrative-parameters
summary: Adds hydrogen to benzene to make cyclohexane, the raw material for nylon, and strips benzene from fuels.
category: Chemicals and fuels
description: >
  Benzene takes three hydrogens to become cyclohexane. The reaction gives off heat, so equilibrium favors low
  temperature and turns back above about 250 °C. First order in benzene, with the approach to equilibrium from
  thermodynamics (NASA Glenn data, since both rings sit outside GRI-Mech).

reference_temperature_K: 373.15

species:
  C6H6:  {formula: C6H6}
  H2:    {formula: H2}
  C6H12: {formula: C6H12, cantera: "C6H12,cyclo-"}
  N2:    {formula: N2}

pathways:
  hydrogenation:
    equation: C6H6 + 3 H2 <=> C6H12
    role: desired
    rate: {key: C6H6, orders: {C6H6: 1}, ln_k_ref: 1.652, Ea_kJ: 50}

metrics:
  c6h6_conversion:
    kind: conversion
    species: [C6H6]
    description: "Share of the benzene turned into cyclohexane."
  c6h6_out:
    kind: outlet
    species: [C6H6]
    description: "Benzene left in the gas."

screening:
  descriptor: {C: 1}
  pathways: [hydrogenation]
  metric: c6h6_conversion
  reference: {formula: Os, name: Osmium}
  optimum_shift_eV: 0.0
  peak_gas: {}   # the reaction's gases hold none its adsorbates exchange with; the top holds still
  suggested_elements: [Os, Co, Pt, Ir, Ni, Ru, Re, Rh, Pd, Cu]
  # Kept to the library and the Catalyst playground until the reaction check (experiments/reaction_check)
  # scores its ranking against the published table; the Manual's Methodology tab lists the outcome.
  on_design_page: false
  basis: >
    Benzene hydrogenation follows the strength of the metal-carbon bond (Toulhoat and Raybaud, J. Catal. 2003):
    metals that hold carbon weakly, copper and palladium, barely activate the ring, and the strongest binders hold
    the partly hydrogenated rings too tightly. The carbon atom's binding stands in for that bond here. The top is
    set at osmium's, the most active metal in their measurements on alumina.
