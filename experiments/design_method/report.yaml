audit:
  title: What the latest review checked and changed
  text: >
    On 2026-10-25 every step on this page was traced back to its source and every check rerun. The atom-scale steps
    held. The changes below came out of the review, and every number above already includes them.
  checked:
    - "Every UMA number on this page, rerun from scratch: all 361 match the stored results within 0.003 eV."
    - "UMA's published accuracy, read again in the UMA paper: {uma_mae_id:.4f} and {uma_mae_ood:.4f} eV on OC20's test set (Table 2) and {uma_adsorbml:.1f}% in AdsorbML (Table 4)."
    - "The reactor against its exact solution ({reactor_exact_pct:.3f} percentage points), the atom balance and Cantera's equilibrium (step 7), and the anchor at each pack's stated point (step 8)."
    - "Each pack's volcano slopes against the Brønsted–Evans–Polanyi work they rest on (A11)."
    - "The likely range against brute force over every case it covers (step 9)."
  changed:
    - "The volcano's weak side now falls 1.8 eV per eV for the four reactions whose weak side waits on a molecule splitting into two atoms the descriptor counts (CO oxidation, engine exhaust, ammonia synthesis, methanation), twice the generic 0.9 (A11). In the CO oxidation example silver moves from fifth to ninth, and platinum leads across the whole 50 to 350 °C."
    - "The volcano check runs {volcano_settings_n} settings, with weak-side slopes from {volcano_slopes_weak} (step 6)."
    - "The likely range lets the peak move anywhere from {peak_follow_low:.2f} to {peak_follow_high:.2f} times as far as its gas, the bracket the exact two-step cycle calls for with the new slopes, and finds its ends exactly (step 9). Before, it sampled a few cases with the peak moving fully or halfway."
    - "The hand-built benchmark is described as what it is: the same UMA model with structures set up by hand, a check of the automation (step 5)."
    - "UMA's published errors cite Tables 2 and 4 of the UMA paper with their exact values (step 4)."
    - "Rhodium's place in the example comes straight from the computed figure, {example_rh_design} of platinum's speed (step 6)."

reproduce:
  text: >
    Two scripts produce every number on this page. The first runs UMA ({atomistic_minutes:.0f} minutes on this Mac);
    the second runs in the app's Python in seconds and writes the summary this page reads.
  code: |
    # 1. the UMA checks -> results/atomistic.json
    export TORCHDYNAMO_DISABLE=1
    /opt/miniconda3/bin/python3 experiments/design_method/atomistic_checks.py
    # 1b. the oxide check -> experiments/oxide_check/results/oxide.json (OC22 download and extraction in its scripts)
    for m in single nh3 anatase101; do /opt/miniconda3/bin/python3 experiments/oxide_check/oxide_check.py $m; done
    # 2. everything else -> results/summary.json
    uv run python experiments/design_method/model_checks.py
    # 3. the unit checks named on this page
    uv run pytest tests/test_design.py
  versions:
    - "UMA-S 1.1 (uma-s-1p1.pt) with fairchem-core 2.23 and PyTorch 2.13, on CPU; UMA-S 1.2.1 (uma-s-1p2p1.pt) for the oxide check."
    - "OC22 validation sets from the IS2RE-Total LMDBs (CC BY 4.0), read with a restricted unpickler (experiments/oxide_check/extract_oc22.py)."
    - "ASE 3.29; Cantera 3.2 with GRI-Mech 3.0."
    - "The example screen: examples/screens/. The hand-built benchmark: experiments/uma_binding/. Results before the face fix: experiments/design_method/data/."

