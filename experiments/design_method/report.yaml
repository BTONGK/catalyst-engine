# The Manual's Methodology tab: how the design app works, every assumption, and the check behind each step.
# {name} fills in from results/summary.json (values), written by model_checks.py from atomistic_checks.py's run.
kind: methodology
summary: results/summary.json
title: "How the app designs a catalyst: method and checks"
byline: >
  Method paper for the catalyst design app. Checks run {generated} with UMA-S 1.1 (fairchem-core 2.23) on this
  Mac's CPU. Every number on this page comes from experiments/design_method/results/summary.json.

abstract: >
  The app ranks candidate materials for a chosen reaction by how fast each would run it compared with a catalyst
  already in use, the catalyst to beat. It gets there in nine steps: a crystal, a surface cut from it, the spots
  where molecules sit, a relaxation with Meta's UMA model, a binding energy, a place on the reaction's activity
  volcano, a simulated reactor, a calibration against the catalyst to beat, and an error bar. This page states every
  assumption and tests each step on its own. The atom-scale steps hold up: more sites, tighter convergence and
  thicker slabs move a binding energy by {sites_max_gain:.2f}, {tolerance_max_gap:.3f} and {slab_thickness_max_gap:.3f} eV
  at most, and the automatic pipeline reproduces a benchmark built by hand with the same model within
  {benchmark_max:.2f} eV. The
  reactor reproduces an exact solution within {reactor_exact_pct:.3f} percentage points of conversion, balances every atom and reaches the equilibrium
  Cantera computes on its own. One check caught a fault, now fixed: the rule that picks the surface chose open faces
  on two ordered alloys. Two steps carry most of the uncertainty: the atoms an alloy shows on its surface (binding
  moves by up to {seg_max:.1f} eV when one element gathers on top) and the volcano, whose generic strong-side
  slope places metals that bind strongly far below where experiments find them. The volcano's peak moves with
  temperature and gas mix, following the free energy of the gas its key molecule comes from, so the leader can change
  across a temperature range; an exact two-step solution moves the peak {peak_follow_min:.2f} to {peak_follow_max:.2f}
  times as far as that rule, and the likely range spans {peak_follow_low:.2f} to {peak_follow_high:.2f} times to
  carry the difference. Read the ranking as a guide to the
  materials worth a closer look, and speed ratios beyond about tenfold as qualitative. A closing section lists the
  parts of a real catalyst the method leaves out (the support, promoters, zeolite sites, diffusion inside a coat),
  why each stays out, and how large each is. Oxides carry the largest error measured there: against OC22's DFT the
  catalysis mode misses molecules on oxide surfaces by {oxide_app_mae_ood:.2f} eV and the materials mode by
  {oxide_mat_mae_ood:.2f} eV, and only the materials mode matches measured ammonia on titania, so oxides belong in
  the materials mode.

how_to_read: >
  Every step follows the same pattern: what the app does in plain words, the equation with its meaning in words,
  the assumptions it rests on (A1, A2 and so on), and the checks, with the measured numbers in the boxes that open.
  A colored tag on each step gives the outcome.

intro:
  - title: The question the app answers
    text: >
      For a reaction you pick, which materials would run it fastest, compared with a catalyst already in use? The
      app answers with a ranking and a predicted speed ratio for each material, then turns each ratio into a
      performance curve at your conditions. It is a screening tool: it narrows many possible materials down to the
      few worth making and testing in a lab. It predicts ratios between materials more reliably than absolute rates,
      because the absolute rates come from the reaction pack, whose parameters stay illustrative until a lab measures
      them.
    points:
      - "From you: the reaction, the temperatures, pressure, gas mix and flow, and the materials to try."
      - "From published data: crystal structures (the Materials Project), each reaction's chemistry and the position of its volcano peak, cited in the reaction pack."
      - "Computed here: every binding energy (UMA), every speed ratio, every performance curve and every error bar."
  - title: The method at a glance
    flow: true
    text: >
      Nine steps turn a crystal into a ranking. Steps 1 to 5 work at the scale of atoms; steps 6 to 9 turn energies
      into rates, curves and error bars.

steps:
  - title: Candidate crystals
    takes: Material names, or elements to search
    gives: A bulk crystal (cell and atom positions)
    tool: ASE reference crystals; Materials Project
    status: checked
    does: >
      Pure metals start from ASE's reference crystal for each element: its usual structure (fcc, bcc or hcp) at the
      measured lattice constant. Alloys and oxides start from the Materials Project, a public database of about
      150,000 crystals computed with density functional theory (DFT), the standard quantum-mechanical method for
      materials. A search returns materials made only of the elements you name, most stable first. Stability is the
      energy above the convex hull: zero for the most stable arrangement of those elements, positive for less stable
      ones. The defaults keep materials within 0.05 eV per atom of the hull and at most 40 atoms per cell.
    equations:
      - tex: 'E_\text{hull}(\text{material}) = E_\text{material} - E_\text{most stable mix of the same elements} \;\le\; 0.05\ \text{eV/atom}'
        words: a material passes when its energy sits within 0.05 eV per atom of the most stable way to arrange the same elements.
    assumptions:
      - id: A1
        short: The input lattice stands for the real one
        text: >
          The app keeps each crystal's input lattice (measured for pure metals, DFT for Materials Project entries).
          UMA relaxes the atoms of the surface it cuts; the cell keeps its input size.
        effect: A lattice that is too large or too small stretches or squeezes the surface and shifts every binding energy on it.
      - id: A2
        short: Stability at absolute zero stands for stability in use
        text: >
          The energy above hull compares materials at absolute zero in vacuum. Under reaction gas at high temperature
          a metal can oxidize, an alloy can separate and a surface can rebuild.
        effect: A material that changes in use works through a different surface from the one computed.
    checks:
      - text: >
          UMA's own lattice for each of the 14 example crystals, relaxed cell and all, sits within
          {lattice_omat_max_pct:.1f}% of the input in the materials mode (average {lattice_omat_mean_pct:.1f}%). The catalysis
          mode, trained on surfaces, strays up to {lattice_oc20_max_pct:.1f}% on bulk crystals, which is why the app keeps
          the input lattice.
        see: The lattice of each crystal
        table:
          table: lattice
          columns: {material: Material, source: Input crystal, omat_pct: "Materials mode (% change)", oc20_pct: "Catalysis mode (% change)"}
      - text: >
          Stretching or squeezing the platinum and copper lattices by up to 2% moves oxygen's binding by
          {strain_slopes} per 1% of stretch: a stretched surface holds oxygen more tightly. Every input sits about
          {lattice_omat_mean_pct:.1f}% below UMA's own lattice, so most of that shift is shared and cancels against the
          catalyst to beat. What stays is each material's gap minus the catalyst to beat's: {lattice_gap_rms:.2f}% on
          average (at most {lattice_gap_max_rel:.1f}%), worth about {strain_error_est:.3f} eV (at most {strain_error_max:.3f} eV).
        see: Oxygen binding against strain
        chart: {kind: lines, table: strain, x: strain_pct, y: E, color: material, x_title: "Lattice stretched (%)", y_title: "Oxygen binding (eV)"}
    verdict: >
      Keeping the input lattice shifts every material by a similar amount; the part that differs from material to
      material, about {strain_error_est:.2f} eV, goes into the error budget. Stability under reaction gas lies beyond
      this method; read the hull value as a first filter.

  - title: The surface
    takes: The bulk crystal
    gives: A slab a few atomic layers thick, with vacuum above
    tool: ASE and the app's face rule
    status: gap
    does: >
      A catalyst works at its surface, so the app cuts the crystal along one face and keeps a slab a few atoms
      thick. It picks the close-packed face: among all faces with Miller indices up to 1, the one whose outer atomic
      layer packs the most atoms per square ångström, which on metals is also the most stable face. Among faces within
      3% of the densest it prefers one whose top layer has the bulk's composition. The slab repeats sideways to at least
      7 Å wide, keeps at least 7 Å of thickness (90 atoms at most), holds its bottom half at bulk positions, and gets
      20 Å of empty space above, so it feels only itself.
    equations:
      - tex: '(hkl)^* = \arg\max_{(hkl) \in \{-1,0,1\}^3} \frac{N_\text{outer layer}(hkl)}{A(hkl)}'
        words: pick the face whose outer layer holds the most atoms per unit area.
      - tex: '\theta = \frac{1\ \text{molecule}}{N_\text{surface atoms in the cell}} \approx \tfrac{1}{9}\ \text{to}\ \tfrac{1}{16}'
        words: each calculation places one molecule on a cell of 9 to 16 surface atoms, a lightly covered surface.
    assumptions:
      - id: A3
        short: One face stands for the whole particle
        text: >
          Real catalyst particles expose several faces plus steps, edges and corners, and steps run some reactions
          much faster than flat faces.
        effect: Activity that comes from steps or edges stays outside the ranking; it holds best where the close-packed face dominates.
      - id: A4
        short: The surface keeps the bulk's arrangement
        text: >
          The top layer keeps the bulk's composition and order. Real alloys often enrich one element at the surface
          (segregation), especially under oxygen or CO, and some surfaces rebuild.
        effect: For alloys, the computed surface can differ from the working one by the termination spread measured below.
      - id: A5
        short: A lightly covered surface
        text: One molecule per cell, about a ninth to a sixteenth of a full layer.
        effect: Crowded surfaces under reaction gas hold each molecule more weakly; comparisons hold best between materials at similar coverage.
    checks:
      - text: >
          This check caught a fault, now fixed. The first version picked the face with the widest spacing between
          lattice planes. For a pure metal that is the close-packed face, but an ordered alloy's cell holds several
          atoms, and the rule picked open square faces for Cu3Au and CuPd, and faces with a single element on top for
          PdPt and CuPt. The rule now measures the packing of the outer atomic layer itself. All {metals_unchanged} pure
          metals keep the same face, and their binding moves by {metals_max_shift:.3f} eV at most (the nudge of step 4,
          added since); all four alloys now show a close-packed face with
          the bulk's composition on top. Their binding moved by up to {face_fix_max_shift:.2f} eV ({face_fix_max_material},
          whose top layer went from pure platinum to mixed).
        see: Each material's face, before and after the fix
        table:
          table: faces
          columns: {material: Material, face_before: Face before, face: Face now, top_layer: Top layer now, packing_per_A2: "Atoms per Å²", E_before: "O binding before (eV)", E_after: "O binding now (eV)"}
      - text: >
          Thicker slabs, up to 13 Å, move oxygen's binding on platinum and ruthenium by at most
          {slab_thickness_max_gap:.3f} eV. Wider slabs, one oxygen per 25 surface atoms in place of 9, hold it
          {slab_width_gap_min:.2f} to {slab_width_gap_max:.2f} eV more tightly on both metals: the coverage effect of A5,
          shared by both metals to within {slab_width_spread:.3f} eV.
        see: Binding against slab size
        table:
          table: slab_size
          columns: {material: Material, thickness_A: "Thickness (Å)", width_A: "Width (Å)", n_atoms: Atoms, layers: Layers, E: "O binding (eV)", site: Site}
      - text: >
          Real alloys often gather one element at the surface. Making each alloy's top layer entirely of one element,
          then the other, moves oxygen's binding by {seg_min:.2f} to {seg_max:.2f} eV per alloy, more than the error bar.
        see: Each alloy as cut, and with one element on top
        table:
          table: segregation
          columns: {material: Material, face: Face, surface: Surface, top_layer: Top layer, E: "O binding (eV)", site: Best spot}
    verdict: >
      Pure metals: settled. Alloys: their binding depends on which atoms end up on top, by up to {seg_max:.1f} eV.
      Until the app computes segregation, read alloy results with that extra spread, and check a promising alloy with
      each element on top before making it.

  - title: Where molecules sit
    takes: The slab
    gives: Starting positions for each molecule
    tool: The app's site finder
    status: checked
    does: >
      Molecules prefer particular spots: on top of one atom (top), between two (bridge), or in the dip between three
      or four (hollow). The app finds these spots from the top layer's geometry: a top site over the highest atom of
      each element, a bridge between the first atom and its nearest neighbor, and up to two distinct hollows. Each
      molecule starts at a typical height above its preferred kinds of spot first (oxygen: hollow, then bridge, then
      top). The quick setting tries 2 spots, standard 3 and thorough 5.
    assumptions:
      - id: A6
        short: The best of the tried spots is the best spot
        text: The lowest energy among the tried spots stands for the molecule's preferred spot on that surface.
        effect: A better spot left untried makes the surface look like it holds the molecule more weakly than it does.
    checks:
      - text: >
          Every spot on all {sites_n} example surfaces was tried. The standard setting's three spots found the same
          lowest energy, within 0.01 eV, on {sites_same_minimum} of {sites_n}; the largest gain from trying every spot was
          {sites_max_gain:.3f} eV.
        see: Standard spots against every spot
        table:
          table: sites
          columns: {material: Material, sites_tried: Spots on the surface, site_standard: "Best of the standard 3", E_standard: "Its O binding (eV)", site_all: Best of every spot, E_all: "Its O binding (eV) over every spot", gain: "Gain (eV)"}
    verdict: Three spots find the best spot on these surfaces; the thorough setting covers surfaces with many distinct spots.

  - title: Relaxing the atoms with UMA
    takes: Each starting structure
    gives: The relaxed structure and its energy
    tool: UMA-S 1.1 and the BFGS method
    status: published
    does: >
      Each starting structure first takes a nudge: every free atom moves about 0.03 Å in a random direction (a fixed
      seed, so a rerun gives the same answer). A perfectly symmetric start can sit balanced on an energy ridge, where
      every force is zero yet the arrangement is unstable; the nudge tips it off. Then the structure moves to its
      nearest stable arrangement: the atoms shift downhill in energy step by step (the BFGS method) until the largest
      force on any free atom falls below 0.05 eV/Å, or 250 steps pass (standard setting). Energies and forces come from UMA, Meta FAIR Chemistry's machine-learned model, trained on
      {uma_structures_million} million structures computed with DFT. Its catalysis mode (oc20) reproduces the OC20
      dataset's DFT setup, the RPBE functional, built for molecules on metal and alloy surfaces; its materials mode
      (omat) reproduces bulk-crystal DFT (PBE, plus a +U correction for some oxides).
    equations:
      - tex: '\mathbf{F}_i = -\frac{\partial E}{\partial \mathbf{r}_i}, \qquad \text{stop when } \max_i \lVert \mathbf{F}_i \rVert < 0.05\ \text{eV/Å}'
        words: the force on each atom is how steeply the energy falls as it moves; the relaxation stops when every force is small.
    assumptions:
      - id: A7
        short: UMA reproduces DFT
        text: >
          UMA's energies match what DFT with the same setup would give, within its published error. The catalysis
          mode reproduces spin-free DFT, so iron, cobalt and nickel count as spin-free metals there.
        effect: >
          An error larger than the error bar reorders materials that sit close together. For the magnetic metals the
          catalysis mode describes a different metal from the real one (the iron check below).
      - id: A8
        short: Absolute zero, the nearest minimum
        text: The relaxation finds the nearest stable arrangement at absolute zero; vibrations and arrangements farther away stay out.
        effect: A molecule that would move into the surface or rearrange at working temperature looks stable where it started.
    checks:
      - text: >
          Published: on the OC20 test set, UMA-S 1.1's adsorption energies sit {uma_mae_id:.4f} eV from DFT on
          average for molecules and surfaces like those it trained on, and {uma_mae_ood:.4f} eV where both the molecule
          and the surface are new to it. In AdsorbML, which asks for the best spot over many starts, UMA-S 1.1 lands
          within 0.1 eV of DFT's answer for {uma_adsorbml:.1f}% of systems (Wood et al. 2025, Tables 2 and 4).
      - text: >
          Re-relaxing each best structure to 0.01 eV/Å, five times tighter, moves its binding by at most
          {tolerance_max_gap:.3f} eV.
        see: Standard against tight convergence
        table:
          table: tolerance
          columns: {material: Material, E_standard: "O binding at 0.05 eV/Å", E_tight: "O binding at 0.01 eV/Å", difference: "Difference (eV)"}
      - text: "{convergence_note}"
      - text: >
          The same code on the same structure gives the same answer: rerun from scratch, every material's binding
          matches the example screen within {repro_max_gap} eV.
      - text: >
          The nudge leaves settled surfaces where they were: on all {nudge_n} example materials it changes the clean
          slab's energy by {nudge_max_change:.3f} eV at most.
        see: Each clean slab, nudged and exact
        table:
          table: nudge
          columns: {material: Material, change: "Energy change (eV)", moved_A: "Largest move while settling (Å)"}
      - text: >
          This check caught a fault, now fixed. In the catalysis mode the clean iron surface sat balanced on a ridge:
          an exactly symmetric slab feels zero force, so the earlier procedure (LBFGS from the exact start) stopped there. Ammonia
          on that slab let it fall, and its binding read {iron_before:.2f} eV, an artifact. Nudged, the clean slab
          settles {iron_slab_drop:.2f} eV lower and ammonia binds at {iron_after:.2f} eV. The cause is magnetism (A7):
          stretched from its bcc cell toward fcc, iron in the catalysis mode drops {iron_fcc_oc20:.2f} eV per atom,
          while the materials mode, which includes spin, keeps bcc the most stable (fcc {iron_fcc_omat:.2f} eV per
          atom higher), as for real iron. The catalysis mode's iron therefore rearranges toward a spin-free packing.
          LBFGS returns to the ridge even after the nudge; BFGS settles, so the app now uses BFGS. Each binding energy
          is also set against the lower of the clean slab and the bare surface left once the molecule is lifted off
          (step 5).
        see: Iron stretched from bcc to fcc in both UMA modes
        table:
          table: bain
          columns: {c_over_a: "Cell height over width (1 is bcc, 1.41 is fcc)", oc20: "Catalysis mode (eV per atom)", omat: "Materials mode (eV per atom)"}
    verdict: >
      The relaxation settings add {tolerance_max_gap:.2f} eV at most. UMA's own error, {uma_mae_ood:.2f} eV on average against DFT,
      is the larger part and goes into the error bar. Read iron, cobalt and nickel from the catalysis mode with care.

  - title: Binding energy
    takes: The relaxed energies
    gives: How strongly the surface holds each molecule (eV)
    tool: Gas references computed with the same model
    status: checked
    does: >
      The binding energy compares the surface holding the molecule with the bare surface and the molecule's source
      in the gas. The app takes each atom from a stable gas: oxygen from water minus hydrogen, nitrogen from half an
      N2, hydrogen from half an H2, carbon from CO minus oxygen. Molecules such as CO, NO and NH3 are their own
      reference. Negative means held; more negative means held more tightly. All gas energies come from the same
      model in the same run. The bare surface is the lower of two: the clean slab, and the surface left when the
      molecule is lifted off and the rest relaxes again. A surface that rearranges under the molecule then counts
      only the bond, and the Results page notes it.
    equations:
      - tex: 'E_\text{bind}(\mathrm{O}) = E(\text{slab}+\mathrm{O}) - E(\text{slab}) - \left[E(\mathrm{H_2O}) - E(\mathrm{H_2})\right]'
        words: the energy of the surface holding an oxygen atom, minus the bare surface, minus an oxygen atom taken from water.
    assumptions:
      - id: A9
        short: Energies stand for free energies
        text: >
          Binding energies are electronic energies; zero-point vibration, heat and entropy stay out. These corrections
          are similar from one metal to the next, so they largely cancel against the catalyst to beat.
        effect: Materials with different corrections, such as an oxide against a metal, shift relative to each other.
    checks:
      - text: >
          UMA's own energies of H2, N2 and H2O match the OC20 reference energies, and its formation energies of NH3 and
          NO match experiment, all within {gas_max_gap:.2f} eV.
        see: Gas molecules
        table:
          table: gas
          columns: {quantity: Quantity, uma_eV: "UMA (eV)", reference_eV: "Reference (eV)", reference: Reference, difference: "Difference (eV)"}
      - text: >
          A benchmark built by hand with the same UMA model (the Model accuracy page) set up oxygen on {benchmark_n}
          metals: 3×3 cells, four layers, sites placed one by one. The app's automatic pipeline matches it within
          {benchmark_max:.2f} eV (average {benchmark_mae:.2f} eV, R² {benchmark_r2:.4f}). This checks the automation;
          UMA's own error against DFT is the published figure in step 4.
        see: The app against the hand-built benchmark
        chart: {kind: parity, table: benchmark, x: E_benchmark, y: E_app, label: material, x_title: "Hand-built benchmark (eV)", y_title: "The app (eV)", caption: "Each dot is one metal; the dashed line marks perfect agreement."}
        table:
          table: benchmark
          columns: {material: Metal, E_benchmark: "Benchmark (eV)", E_app: "The app (eV)", difference: "Difference (eV)"}
      - text: >
          On those metals UMA reproduces all 14 textbook orderings of binding strength across the periodic table and
          the scaling slopes linking O to OH and N to NH and NH2 (Abild-Pedersen et al. 2007; Model accuracy page).
    verdict: Binding energies come out consistent, reproducible and in line with known chemistry.

  - title: Activity from the volcano
    scale: performance
    takes: Each material's binding energy
    gives: A speed ratio against the catalyst to beat
    tool: The reaction pack's Sabatier volcano; Cantera's gas data move its peak
    status: open
    does: >
      The Sabatier principle: a good catalyst holds the key molecule firmly enough to activate it and lightly enough
      to let the products go. Activity plotted against binding strength forms a volcano: it rises as binding
      strengthens, peaks, then falls as the surface clogs. Each reaction pack names its key molecule (the
      descriptor), where the peak sits relative to the catalyst to beat, and how steeply each side falls. The app
      places every material on that volcano by its computed descriptor.

      The peak moves with temperature and gas mix. Near the top, the key molecule comes and goes between the gas and
      the surface, so the best catalyst is the one whose grip balances how readily the gas sticks under those
      conditions. Heat lowers the gas's free energy (its entropy counts for more), the surface empties more easily,
      and the peak slides toward materials that bind more strongly; a richer feed slides it the other way. Each pack
      names the gas its key molecule comes from (oxygen gas for CO oxidation, nitrogen for ammonia synthesis,
      ammonia for SCR) and sets δ at its anchor temperature and standard feed; Cantera's GRI-Mech 3.0 data give the
      gas's free energy everywhere else. The extra barrier, and with it the order of the materials, is computed
      separately at every temperature.
    equations:
      - tex: 'd = \sum_a w_a \, E_\text{bind}(a)'
        words: the descriptor is the binding energy of the key molecule, or a weighted average of two.
      - tex: 'd^*(T, p) = d_\text{ref} + \delta + \sum_g n_g \left[\mu_g(T, p_g) - \mu_g(T_0, p_g^0)\right], \qquad \mu_g = g^\circ_g(T) + k_B T \ln\frac{p_g}{p^\circ}'
        words: "the peak sits a distance δ from the catalyst to beat's own descriptor at the pack's anchor temperature T₀ and standard feed (δ from published work: 0.2 eV weaker than platinum for CO oxidation), and elsewhere moves with the free energy μ of the gas the key molecule comes from, n_g molecules per molecule bound (½ O₂ per oxygen atom); for CO oxidation it moves {peak_move_co:.2f} eV toward stronger binding per 100 °C of heat."
      - tex: 'h(d) = s_w \max(d - d^*, 0) + s_s \max(d^* - d, 0)'
        words: "how far below the peak a material sits, falling by s_w per eV on the weak side and s_s on the strong side (A11): {slope_weak_example:.1f} and {slope_strong_example:.1f} for CO oxidation."
      - tex: '\Delta E^\ddagger(T) = h(d) - h(d_\text{ref}), \qquad \frac{r}{r_\text{ref}} = \exp\!\left(-\frac{\Delta E^\ddagger(T)}{k_B T}\right)'
        words: "the extra energy barrier against the catalyst to beat, at each temperature, sets the speed ratio; at {design_T:.0f} °C each 0.1 eV of extra barrier slows the reaction {factor_01:.0f} times, at 400 °C {factor_01_400:.1f} times."
    assumptions:
      - id: A10
        short: One descriptor captures the mechanism
        text: >
          Scaling relations tie the binding of related molecules together, so one binding energy (or two) tracks the
          whole mechanism (Abild-Pedersen et al. 2007; Medford et al. 2015).
        effect: A reaction whose rate also depends on a second, independent property, such as CO crowding the surface in CO oxidation, ranks poorly.
      - id: A11
        short: Barriers move in step with binding
        text: >
          The Brønsted–Evans–Polanyi relation: a change in binding changes the barrier in proportion (Bligaard et al.
          2004). On metals the barrier to split a molecule rises about 0.9 eV for each eV the split grows less
          favorable (Nørskov et al. 2002). Where the weak side waits on a molecule splitting into two atoms the
          descriptor counts (O2 into two O for CO oxidation and engine exhaust, N2 into two N for ammonia synthesis,
          CO into C and O for methanation), the splitting energy moves twice as fast as the descriptor, so that side
          falls 1.8 eV per eV, the slope Nørskov et al. (2004) use for O2 splitting; the other reactions keep the
          generic 0.9. The strong side falls a generic 1.0 eV per eV in every pack.
        effect: >
          Wrong slopes stretch or squeeze the speed ratios, and far from the peak the error compounds into huge
          factors. At the pack's own peak, every slope pair in the check below keeps the order's rank correlation at
          {volcano_spearman_slopes_min:.2f} or higher.
      - id: A12
        short: One mechanism and prefactor for every material
        text: Every material runs the reaction by the same route with the same attempt frequency; only the barrier changes.
        effect: A material that takes a different route falls outside the model.
      - id: A13
        short: The peak follows the free energy of the gas that feeds it
        text: >
          Each pack cites the source of δ and holds it at its anchor temperature with its standard feed. Away from
          there, the peak keeps one adsorption free energy for the key molecule against its gas, so it moves by that
          gas's change in free energy (the chemical potential of ab initio thermodynamics, Reuter and Scheffler 2001).
          The bound molecule's own heat and entropy stay out, and a gas missing from the inlet counts at standard
          pressure. The likely range lets the peak move anywhere from {peak_follow_low:.2f} to
          {peak_follow_high:.2f} times as far as its gas, the span an exact two-step solution calls for (below).
        effect: >
          Where sticking itself is slow enough to set the rate, the real peak moves less, down to
          {peak_follow_min:.2f} times as far in the exact cycle; products building up along the bed shift it further.
          Far from the anchor, the move is an extrapolation.
      - id: A14
        short: Errors shared by every material cancel
        text: The catalyst to beat runs in the same screen with the same settings, so constant offsets of the model and of DFT drop out of every comparison.
        effect: Errors that differ from material to material stay.
    checks:
      - text: >
          The arithmetic is tested (tests/test_design.py): the catalyst to beat sits at exactly 1×, a material at the
          peak gains exactly h(d_ref), and each side rises at its slope.
      - text: >
          {volcano_settings_n} volcano settings, with the peak from 0 to 0.4 eV weaker than platinum and the slopes
          from {volcano_slopes_weak} on the weak side and {volcano_slopes_strong} on the strong side, keep the example's
          rank correlation with its own order at {volcano_spearman_all_min:.2f} or higher (1 means the same order); the
          leader is always one of {volcano_leaders}.
        see: The ranking under {volcano_settings_n} volcano settings
        table:
          table: volcano_sensitivity
          columns: {optimum_shift_eV: "Peak δ (eV)", slope_weak: Weak-side slope, slope_strong: Strong-side slope, leader: Leader, top3: Top three, spearman: Rank correlation}
      - text: >
          Against experiment, this step carries the largest uncertainty in the app. With these slopes the example puts
          rhodium at {example_rh_design} of platinum's speed for CO oxidation at {design_T:.0f} °C, and nickel,
          ruthenium and cobalt slower still, while supported rhodium, ruthenium and palladium are well-known, active CO
          oxidation catalysts. Two causes are known: on platinum-group metals CO oxidation also depends on how strongly
          CO binds (Falsig et al. 2008), and the strong side's generic slope compounds far from the peak. The next version fits each reaction's
          descriptor and slopes to published volcano data and checks them against measured activities.
      - text: >
          The moving peak against an exact solution. A two-step cycle (the gas sticks, the bound molecule reacts away),
          solved at steady state with collision-rate sticking and detailed balance against the gas, for oxygen at the
          CO oxidation feed: from {peak_check_T} °C to 200 °C hotter the gas's free energy falls {peak_gas_change_200:.2f}
          eV, and the cycle's peak moves {peak_follow_min:.2f} to {peak_follow_max:.2f} times as far depending on the
          mechanism. Where sticking is free of a barrier the peak follows the gas fully, as the app assumes; with CO
          oxidation's slopes ({slope_weak_example:.1f} and {slope_strong_example:.1f}) read as a barrier to sticking it
          moves {peak_follow_app:.2f} times as far. The likely range lets the peak move anywhere from
          {peak_follow_low:.2f} to {peak_follow_high:.2f} times as far as its gas, so it {peak_follow_covers} every case in the
          table, and takes the exact lowest and highest barrier over that span and the descriptor's error bar together
          (step 9).
        see: The exact cycle's peak against the gas
        table:
          table: peak_cycle
          columns: {case: Mechanism, peak_moved_eV: "Peak moved (eV)", gas_change_eV: "Gas free energy moved (eV)", follow: Share followed}
      - text: >
          How far each reaction's peak moves per 100 °C above its anchor, with its standard feed: from a few meV
          where the gases taken up and given off balance (reforming, methanol) to {peak_move_largest:.2f} eV for
          high-temperature SCR, where ammonia at 20 ppm gives up a great deal of entropy when it sticks.
        see: Each reaction's peak gas and move
        table:
          table: peak_moves
          columns: {reaction: Reaction, gas: "Peak gas (molecules per molecule bound)", anchor_C: "Anchor (°C)", move_per_100K: "Move per 100 °C hotter (eV)"}
      - text: >
          The tests (tests/test_design.py) confirm the move equals the gas's free-energy change computed straight from
          Cantera, that the anchor reproduces the fixed volcano exactly, and that the lead passes from a weak binder to
          the catalyst to beat to a strong binder as a screen heats up.
    verdict: >
      The order near the peak holds across volcano settings, and the peak now moves with temperature and gas mix by a
      rule an exact two-step solution brackets. Read ratios beyond about tenfold as "clearly slower" and the far side
      of the volcano as qualitative.

  - title: Performance in a reactor
    takes: Each material's speed ratio
    gives: Conversion or yield against temperature
    tool: The engine's plug-flow reactor; Cantera thermodynamics and transport
    status: checked
    does: >
      Each reaction pack writes the chemistry as balanced pathways with rate laws: the wanted reaction and its side
      reactions. For each material the screened pathways take the extra barrier from step 6, and a plug-flow reactor
      model computes the gas leaving the catalyst bed at each temperature, at your pressure, gas mix and space
      velocity: the gas flows through the bed and reacts as it goes. Reversible reactions stop at chemical
      equilibrium, computed from GRI-Mech 3.0 thermodynamic data with Cantera. A stiff solver (the ROS2 Rosenbrock
      method with error control) integrates along the bed. The catalyst's form (Advanced) sets how gas meets it: as
      fine powder every molecule reaches the surface at once; in a coated honeycomb (monolith), as in exhaust
      systems, gas has to cross each channel to its wall, and each reaction runs at most as fast as its key gas arrives.
      That rate comes from the channel's size and each gas's diffusion coefficient (Cantera, mixture-averaged), with
      the Sherwood number of fully developed laminar flow in a square channel, 2.98 (Shah and London).
    equations:
      - tex: 'k(T) = k_\text{ref}\exp\!\left[-\frac{E_a}{R}\left(\frac{1}{T} - \frac{1}{T_\text{ref}}\right)\right], \qquad k_\text{material}(T) = k(T)\,\exp\!\left(-\frac{\Delta E^\ddagger}{k_B T}\right)'
        words: the rate constant rises with temperature (Arrhenius), and each material's extra barrier scales it at every temperature.
      - tex: '\frac{dF_i}{dV} = \sum_j \nu_{ij}\, r_j, \qquad r_j = k_j \prod_i C_i^{\,n_{ij}} \left(1 - \frac{Q_j}{K_j}\right)'
        words: along the bed, each gas changes by what the reactions make or use; a reversible reaction slows to a stop as it nears equilibrium (Q reaches K).
      - tex: 'r_j^\text{honeycomb} = \frac{r_j\, k_m a\, C_\text{key}}{r_j + k_m a\, C_\text{key}}, \qquad k_m a = \frac{\mathrm{Sh}\, D_\text{key}}{d_h}\cdot\frac{4 d_h}{p^2}, \quad \mathrm{Sh} = 2.98'
        words: "in a honeycomb each reaction runs at the slower of two rates, the surface's own and the rate its key gas crosses the channel (d_h the channel width, p the cell pitch); for a first-order reaction this gives k k_m a / (k + k_m a), exactly."
    assumptions:
      - id: A15
        short: Ideal plug flow at one temperature; for a honeycomb, the trip to the wall
        text: >
          The bed holds one temperature and the gas moves as a plug. As powder, molecules reach the surface at once; in
          a honeycomb they cross the channel at the fully developed laminar rate, and the coat counts as thin, so
          diffusion inside it stays out. The rate constants count per volume of the catalyst as shaped.
        effect: >
          Hot spots, back-mixing and diffusion inside a coat or pellet lower real conversion, most of all near full
          conversion. Rate constants measured on one form carry over to another only after scaling by the active
          material each holds per volume.
      - id: A16
        short: The pack's rate laws and parameters
        text: Rate-law forms and the catalyst to beat's parameters come from the reaction pack; most packs mark them illustrative until measured.
        effect: Absolute temperatures and conversions shift; the order of the materials stays.
      - id: A17
        short: Fresh catalyst at steady state
        text: The catalyst works as made, with steady gas flow.
        effect: Aging, poisoning and sintering lower activity over time.
    checks:
      - text: >
          Against the exact plug-flow solution for a first-order reaction, including the change in gas volume as it
          reacts, the engine's conversion agrees within {reactor_exact_pct:.3f} percentage points.
        see: The engine against the exact solution
        table:
          table: reactor_exact
          columns: {T_C: "Temperature (°C)", X_engine: Engine, X_exact: Exact}
      - text: >
          Atoms balance: in all {balance_packs} reactions the gas leaving holds every element in the same proportion as
          the gas entering, to {balance_digits} decimal places.
        see: Atom balance per reaction
        table:
          table: element_balance
          columns: {reaction: Reaction, worst_element_gap: Largest relative gap}
      - text: >
          With a very fast catalyst the outlet matches Cantera's own equilibrium calculation to {equilibrium_digits}
          decimal places in mole fraction, for the {equilibrium_packs} reactions with a single reversible reaction.
        see: Equilibrium against Cantera
        table:
          table: equilibrium
          columns: {reaction: Reaction, temperatures_C: "Temperatures (°C)", largest_mole_fraction_gap: Largest gap (mole fraction)}
      - text: >
          Fitted to published measurements, the same reactor and rate laws reproduce eight SCR catalysts from four
          sources, with NO conversion within 0.011 to 0.025 on average for three zeolites (Literature check page).
      - text: >
          In a honeycomb ({form_cpsi:.0f} cells per square inch, {form_channel_mm:.2f} mm channels), the reactor matches
          the exact plug-flow answer for a first-order reaction with the wall rate in series within
          {film_exact_pct:.3f} percentage points.
        see: Honeycomb against the exact solution
        table:
          table: film_exact
          columns: {T_C: "Temperature (°C)", k_wall: "Wall rate k_m a (1/s)", X_powder: "Powder", X_engine: "Honeycomb, engine", X_exact: "Honeycomb, exact"}
      - text: >
          Sizes on hot SCR at {form_T_F:,.0f} °F ({form_T_C:.0f} °C), the reaction's reference temperature: the honeycomb
          lowers the catalyst to beat's NOx conversion by {form_film_drop_pts:.1f} points, and a catalyst ten times
          faster gains {form_gain_film_pts:.1f} points on it against {form_gain_powder_pts:.1f} as powder, since the
          wall caps the gain. Near the channel entrance the gas crosses faster than the fully developed rate; Hawthorn's
          correlation puts that at {form_entrance_factor:.2f} times the rate here, worth {form_entrance_pts:.1f} points,
          so A15's choice holds. Diffusion into a 50 µm coat would take a further {form_coat_drop_lo_pts:.1f} to
          {form_coat_drop_hi_pts:.1f} points, for coats that pass gas at a tenth to a hundredth of its free rate: the
          size of what A15 leaves out.
        see: Each form at the reference temperature
        table:
          table: form
          columns: {form: Form, reference: "Catalyst to beat", ten_times: "Ten times faster", gain: "Gain"}
          percent: [reference, ten_times, gain]
      - text: >
          On published monoliths (Metkar's 400 cpsi cores, Literature check page), the apparent activation energy of
          SCR on Fe-ZSM-5 reads {form_lit_fe}; on Cu-chabazite {form_lit_cu}. The film is a real part of the
          transport, and the coat often the larger part.
        see: Activation energies on the published monoliths
        table:
          table: form_literature
          columns: {catalyst: Catalyst, ideal: "Ideal reactor (kJ/mol)", film: "With the film", film_coat: "With film and coat", published: "Thesis, diffusion resolved"}
    verdict: >
      The reactor solves its equations accurately, conserves atoms and respects equilibrium. A honeycomb's channels are
      modeled exactly; its coat is the open part, so read honeycomb curves as the best a thin coat can do.

  - title: Calibration and light-off
    takes: The catalyst to beat
    gives: Curves anchored to a known catalyst; each material's light-off temperature
    tool: The pack's anchor temperature
    status: checked
    does: >
      Each pack sets the catalyst to beat's rate constant so it reaches half the best possible result at a stated
      temperature, a typical light-off for that catalyst (platinum at 180 °C for CO oxidation). The best possible is
      the same reactor with the screened reactions about 8,000 times faster (e⁹) and nearly independent of
      temperature: its outlet sits at equilibrium or full conversion. A material's light-off temperature is the
      lowest temperature where it reaches half the best possible.
    equations:
      - tex: 'X_\text{ref}(T_\text{ref}) = \tfrac{1}{2}\, X_\text{best}(T_\text{ref}), \qquad T_{50} = \min\{\, T : X(T) \ge \tfrac{1}{2}\, X_\text{best}(T) \,\}'
        words: the catalyst to beat gets halfway at its anchor temperature; a material's light-off is where it first gets halfway.
    assumptions:
      - id: A18
        short: The anchor temperature
        text: Each pack's anchor comes from typical published light-off behavior of its catalyst to beat.
        effect: A wrong anchor slides every curve along the temperature axis together; the order of the materials stays.
    checks:
      - text: "{calibration_note}"
        see: Each reaction's catalyst to beat at its anchor
        table:
          table: calibration
          columns: {reaction: Reaction, reference: Catalyst to beat, T_ref_C: "Anchor (°C)", reference_metric: "Its result at the anchor", best_metric: Best possible, share_of_best: Share of best}
      - text: >
          Reactions built in the app calibrate the same way, and the tests confirm the catalyst to beat lands at half
          the best possible within 5% (tests/test_design.py).
    verdict: The anchor holds where the packs state it.

  - title: Error bars
    takes: Every descriptor
    gives: A likely range for each speed ratio and curve
    tool: The volcano and reactor run at the edges of the error bar
    status: checked
    does: >
      Each binding energy carries an error bar of σ = {sigma_assumed:.2f} eV; a descriptor that averages several binding
      energies carries σ times the square root of the summed squared weights. The app moves each descriptor up and
      down by its error bar, and at every temperature also lets the volcano's peak move anywhere from
      {peak_follow_low:.2f} to {peak_follow_high:.2f} times as far as its gas (step 6). Over all those cases together it finds the
      lowest and highest extra barrier exactly: the barrier is made of straight pieces, so its ends sit at the corners
      of that box of cases or where a material meets the peak. The reactor then runs at both ends, and the spread is
      the likely range. Where the peak sits still, at the anchor temperature with the standard feed, the range comes
      from the binding energy alone.
    equations:
      - tex: '\sigma_d = \sigma \sqrt{\textstyle\sum_a w_a^2}, \qquad \frac{r}{r_\text{ref}} \in \left[\, e^{-\max \Delta E^\ddagger/k_BT},\ e^{-\min \Delta E^\ddagger/k_BT} \,\right] \ \text{over}\ \lvert \tilde d - d \rvert \le \sigma_d,\ f_\text{lo} \le f \le f_\text{hi}'
        words: "the range runs between the slowest and the fastest case over the descriptor's error bar and every share f of the peak's move in the span; at {design_T:.0f} °C, ±{sigma_assumed:.2f} eV spans a factor of {sigma_factor:.0f} either way where the volcano falls 1 eV per eV, and about {sigma_factor_weak:.0f} on CO oxidation's weak side."
    assumptions:
      - id: A19
        short: One error bar for every material
        text: σ is the same for every material and reaction, and errors differ independently between materials; the range covers about two cases in three.
        effect: An error shared by a whole family, such as oxides in one UMA mode, can exceed the bar.
    checks:
      - text: The error budget below adds up the parts this page measures.
      - text: >
          The exact ends hold against brute force: for every reaction pack, a grid of cases over the error bar and
          the peak's span stays inside them and reaches each within the grid's own spacing (tests/test_design.py); a
          301 × 301 grid comes within 0.0005 eV.
    verdict: "σ = {sigma_assumed:.2f} eV covers the parts measured here, {sigma_combined:.2f} eV combined, with room for the DFT functional's own error."

example:
  title: "A worked example: CO oxidation on 14 materials"
  text: >
    The example screen that ships with the app, recomputed after the face fix: oxygen binding on nine metals and
    four alloys against platinum, compared at {design_T:.0f} °C, standard setting, {example_relaxations} relaxations in
    {example_minutes:.0f} minutes on this Mac's CPU. Rows run from fastest to slowest.
  table:
    table: example_ranking
    columns: {material: Material, descriptor_eV: "O binding (eV)", shift_eV: "Extra barrier (eV)", rate_ratio: Speed vs Pt, range_low: Likely from, range_high: Likely to, metric_at_design: "CO conversion"}
    ratios: [rate_ratio, range_low, range_high]
    percent: [metric_at_design]
  points:
    - >
      Speed vs Pt: how fast each material runs CO oxidation compared with platinum at 180 °C; "1 in 140" means 140
      times slower. Likely from and to: the same speed at the two edges of the error bar (step 9). CO conversion: the
      share of CO each material converts at 180 °C in the example's reactor.
    - "Order: {example_ranking}."
    - "Within the error bar of platinum: {example_within_error}."
    - "Rh, Ni, Ru and Co sit far out on the strong-binding side and gold on the weak side, where step 6 flags the volcano as qualitative."
    - >
      Across the screen's {example_t_lo:.0f} to {example_t_hi:.0f} °C the peak moves {example_peak_hot:.2f} eV toward stronger binding;
      the leader at each temperature: {example_leader_spans}. PdPt climbs to {example_pdpt_hot:.2g} times platinum's speed at
      {example_t_hi:.0f} °C, and rhodium rises from {example_rh_design} of platinum's speed at {design_T:.0f} °C to
      {example_rh_hot}: the direction practice shows for metals that bind strongly, at a size step 6's slopes keep
      qualitative.

budget:
  title: The error budget
  text: >
    How large is the error on one binding energy? The parts measured or published, combined as independent errors
    (the square root of the sum of squares):
  rows:
    - {source: UMA against DFT, size: "{uma_sigma_est:.3f}", basis: "Published average error {uma_mae_ood:.4f} eV where both molecule and surface are new to UMA (OC20 test), as a standard deviation (× √(π/2))"}
    - {source: Spots tried, size: "{sites_max_gain:.3f}", basis: Step 3}
    - {source: Convergence, size: "{tolerance_max_gap:.3f}", basis: Step 4}
    - {source: Slab thickness and coverage, size: "{slab_size_max_gap:.3f}", basis: "Step 2: thicker slabs, and how much the coverage effect differs between metals"}
    - {source: Lattice, size: "{strain_error_est:.3f}", basis: "Step 1: each material's lattice gap minus the catalyst to beat's"}
    - {source: "**Combined**", size: "**{sigma_combined:.3f}**", basis: "**Against the app's σ = {sigma_assumed:.2f} eV**"}
  after: >
    The combined {sigma_combined:.2f} eV sits inside the app's σ = {sigma_assumed:.2f} eV, which leaves room for what this
    page measures only in part: the DFT functional's own error against experiment (shared by similar metals and
    largely cancelled by the catalyst to beat) and coverage. Two parts exceed the bar and are reported on their own:
    which element an alloy shows on top (up to {seg_max:.2f} eV, step 2) and the shape of the volcano (step 6).

trust:
  title: When to trust a result
  groups:
    - heading: Firm
      points:
        - Binding energies, and their order among metals on their close-packed faces.
        - Which materials sit near the volcano's peak and which sit far from it.
        - Equilibrium limits, atom balance and the shape of the performance curves.
    - heading: Use with care
      points:
        - Speed ratios beyond about tenfold, and anything on the far side of the volcano (step 6).
        - Alloys, whose surface atoms may differ from the bulk (step 2).
        - Oxides. The materials mode tracks oxide DFT about {oxide_mat_factor:.0f} times closer than the catalysis
          mode and matches measured ammonia on titania; its typical miss, {oxide_mat_mae_ood:.2f} eV, still sits
          beyond the error bar (next section). Screen oxides in the materials mode.
        - Absolute temperatures and conversions, which rest on each pack's illustrative parameters (step 7).
        - Temperatures beyond the reaction's standard test range, where the peak's move and the rates are
          extrapolated; the app flags them.
        - Changes of leader across temperature, which rest on the peak's move (step 6); the likely ranges show how firm
          each is.
    - heading: Outside this method
      points:
        - The parts listed in the next section, each with its size.

limits:
  title: What the app leaves out, and why
  text: >
    A real catalyst is a recipe: an active ingredient on a support, often with a promoter, shaped as powder, pellets
    or a coated honeycomb. The app computes the active ingredient and, in Advanced, the honeycomb's channels. Each
    part below stays out for a measured reason: the app could compute it, yet the checks put its error at or above
    the size of the effect, and a ranking built on it would mislead. Each row gives that size and what to do
    meanwhile.
  rows:
    - part: The support (alumina, titania, a zeolite carrier)
      why: >
        A cluster or layer on a support has a shape found only by a structure search (one published benchmark relaxed
        150 structures per cluster and surface), and machine-learned models' accuracy at the metal–oxide boundary
        varies from one support to the next (Xu et al. 2026).
      size: >
        Uneven across three alumina surfaces for the models benchmarked. On bare titania, the usual SCR support, the
        materials mode matches measured ammonia within {anatase_mat_miss:.2f} eV (below); a metal or vanadia layer on
        it awaits its own test.
      meanwhile: Rank active ingredients here; compare supports on the bench.
    - part: Promoters (a few percent of a second element)
      why: >
        A promoter's shift in binding is often as small as UMA's error on oxide surfaces, and many promoters act on
        structure: tungsten in V2O5–WO3/TiO2 keeps the titania stable and spreads the vanadia, effects a binding
        energy leaves out.
      size: "UMA's best mode on oxides misses DFT by {oxide_mat_mae_ood:.2f} eV on average (below): as large as many promoter effects."
      meanwhile: Treat a promoter as a bench variable.
    - part: Zeolite sites (copper or iron ions in a silica framework)
      why: >
        For ammonia in copper chabazite, UMA's three modes miss published DFT by {zeolite_misses}, at the worst site
        each: every mode sits beyond the app's error bar.
      size: "{zeolite_best_miss:.2f} eV in the best mode ({zeolite_best_mode}), against the app's error bar of {sigma_assumed:.2f} eV."
      meanwhile: >
        The site builder and the check stay in experiments/zeolite_check/, ready for a model that passes; compare
        zeolites with published or bench data.
    - part: Diffusion inside a coat or a pellet
      why: >
        It depends on how fast gas moves through the coat's own pores, a property that varies about tenfold from coat
        to coat and comes from measurement.
      size: "{form_coat_drop_lo_pts:.1f} to {form_coat_drop_hi_pts:.1f} points of NOx conversion for a 50 µm coat on hot SCR's catalyst to beat (step 7)."
      meanwhile: Read honeycomb curves as the best a thin coat can do; powder means fine grains.
    - part: Molecules on oxide surfaces, to the app's error bar
      why: >
        UMA-S 1.1 learned surfaces with molecules from OC20, whose surfaces are metals and intermetallics. Against
        OC22's DFT (Tran et al. 2023) for {oxide_n} single molecules on oxide surfaces, the typical miss on oxides
        new to OC22's training is {oxide_app_mae_ood:.2f} eV in the catalysis mode and {oxide_mat_mae_ood:.2f} eV in
        the materials mode, once each molecule's reference offset is set aside; the error bar holds up to
        {oxide_gate:.2f} eV. Against a measurement, ammonia on anatase TiO2 (101), the catalysis mode binds
        {anatase_app_miss:.2f} eV too weakly and the materials mode lands {anatase_mat_miss:.2f} eV from it.
      size: >
        {oxide_mat_mae_ood:.2f} eV in the better mode, the materials mode. Both modes still order most pairs of oxide
        surfaces that DFT tells apart: {oxide_app_order:.0f}% in the catalysis mode, {oxide_mat_order:.0f}% in the
        materials mode. Hot SCR's vanadium oxide binds ammonia at {v2o5_nh3_app:.2f} eV in the catalysis mode and
        {v2o5_nh3_mat:.2f} eV in the materials mode.
      meanwhile: >
        Screen oxides in the materials mode, against an oxide catalyst to beat; read the order as a guide and the
        speed ratios as rough, and confirm a promising oxide on the bench.
    - part: UMA-S 1.2.1's oxide mode, trained on OC22
      why: >
        It tracks OC22's DFT closest, {oxide_cand_mae_id:.2f} eV on familiar materials and {oxide_cand_mae_ood:.2f} eV
        on new ones, a score that may sit partly inside its own training. Its ammonia in a box sits {far_cand:.2f} eV
        above ammonia drifted off a surface, so every binding set against a gas molecule carries that shift; of the
        five modes tested, {ref_consistent} keep the two consistent.
      size: "{oxide_cand_mae_ood:.2f} eV on new oxides, beyond the {oxide_gate:.2f} eV limit, plus a {far_cand:.2f} eV shift in each binding against gas."
      meanwhile: The test in experiments/oxide_check/ runs again on each new UMA release.
    - part: The most stable cut of an oxide face
      why: >
        The app cuts the face packed most tightly with the bulk's composition and keeps the cut whose composition
        matches the bulk. On anatase that face is (001), a minority face; the (101) face that covers most real anatase
        comes out, when picked in Advanced, with a singly bonded oxygen on top, where ammonia reacts in some modes.
      size: "Up to {cut_gap:.1f} eV of ammonia binding on titania (101) across the modes; {cut_gap_app:.2f} eV in the catalysis mode."
      meanwhile: For an oxide face, check in the 3D view that each top metal keeps most of its oxygen neighbors.
    - part: Magnetism in the catalysis mode
      why: The catalysis mode reproduces spin-free DFT (A7).
      size: "Iron's fcc packing sits {iron_fcc_oc20:.2f} eV per atom below bcc there; real iron keeps bcc (step 4)."
      meanwhile: Run iron, cobalt and nickel in the materials mode as well.
    - part: Which element an alloy shows on top
      why: The surface keeps the bulk's composition (A4); real alloys often gather one element on top under gas.
      size: "Up to {seg_max:.2f} eV of oxygen binding (step 2)."
      meanwhile: Check a promising alloy with each element on top before making it.
    - part: Particle size, poisons, aging, surfaces that rebuild under gas, heat in a full-size reactor
      why: Each needs its own model and its own data.
      size: Specific to each catalyst and plant.
      meanwhile: Bench tests and the Lab data page.
  checks:
    - text: >
        Ammonia in copper chabazite (Materials Project mp-aaaabamv, the 12-site cell, Si/Al 5 or 11), built by the
        app's site builder and relaxed in each UMA mode, against two published DFT studies. The catalysis and
        materials modes leave out the dispersion attraction both studies include; the porous-frameworks mode
        includes it and binds far too tightly.
      see: Ammonia binding in copper chabazite, three UMA modes against published DFT
      table:
        table: zeolite
        columns: {site: Site, oc20: "Catalysis (eV)", omat: "Materials (eV)", odac: "Porous frameworks (eV)", published: "Published DFT (eV)", source: Source}
    - text: >
        Molecules on oxide surfaces, {oxide_modes_n} UMA modes against OC22's DFT (PBE+U, spin-polarized): {oxide_n}
        systems with one molecule each, 40 per molecule from each of OC22's two validation sets, familiar materials
        and materials new to its training, scored at DFT's own structures. Each molecule's median miss is set aside first: it holds
        the gap between the model's and DFT's energy for that molecule, which the app's gas references remove. "In
        order" counts the pairs of surfaces DFT places at least {sigma_assumed:.2f} eV apart that the model places the
        same way round.
      see: Typical miss against OC22's DFT, {oxide_modes_n} UMA modes
      table:
        table: oxide
        columns: {mode: Mode, n: Systems, mae_id: "Familiar materials (eV)", mae_ood: "New materials (eV)", order: "In order (%)", worst: "Hardest molecule (eV)"}
    - text: The same misses, molecule by molecule, on both validation sets together.
      see: Typical miss by molecule (eV)
      table:
        table: oxide_ads
        columns: {adsorbate: Molecule, 1p1_oc20: "1.1 catalysis", 1p1_omat: "1.1 materials", 1p2p1_oc22: "1.2.1 oxide", 1p2p1_oc20: "1.2.1 catalysis"}
    - text: >
        Ammonia on anatase TiO2 (101), against a measurement: {anatase_measured:.2f} ± 0.1 eV to lift one molecule off
        a five-fold titanium at low coverage (temperature-programmed desorption; optB88-vdW DFT gives 1.20 eV; Koust
        et al. 2018). The face is the true (101) cut, two-fold oxygen and five-fold titanium on top, one ammonia per
        four titanium, the bottom half fixed; four and five layers agree within {anatase_layers_gap:.2f} eV. The last
        column is ammonia that drifted more than 3 Å off a surface in the runs below, which reads near zero when a
        mode's gas and surface energies agree. A mode matches when it lands within the error bar and keeps that
        agreement: {anatase_match}.
      see: Ammonia on anatase (101), five UMA modes against the measurement
      table:
        table: anatase
        columns: {mode: Mode, four: "Four layers (eV)", five: "Five layers (eV)", miss: "Miss (eV)", N_Ti: "N–Ti (Å)", far: "Drifted off (eV)"}
    - text: >
        Ammonia on the faces the app cuts itself, built, sited and relaxed exactly as a screen does: anatase's own
        face (001), the (101) face as picked in Advanced, and hot SCR's catalyst to beat, vanadium oxide. Blank cells
        are runs where the molecule broke apart or drifted off at every site tried.
      see: Ammonia on the app's own oxide faces, five UMA modes
