# Published SCR measurements this check reproduces. Each figure is digitized by digitize.py from the source
# file (downloaded to cache/, outside git); only the extracted numbers and their provenance live in data/.

sources:
  metkar2012:
    cite: >
      P. S. Metkar, "Experimental and Kinetic Modeling Studies of Selective Catalytic Reduction of NOx with NH3
      on Fe- and Cu-Zeolite Monolithic Catalysts", PhD dissertation, University of Houston, 2012 (advisors
      M. P. Harold and V. Balakotaiah).
    url: https://uh-ir.tdl.org/items/dec7ab2f-feec-4eaa-9d24-e8cd811ad67d
    pdf: https://uh-ir.tdl.org/bitstreams/0eb40ebd-8eff-4cab-bd04-abde0cc53c00/download
    catalysts:
      fe_zsm5: {name: Fe-ZSM-5, form: "washcoated cordierite monolith, 400 cpsi, 2 cm long, 34 channels"}
      cu_cha: {name: Cu-chabazite, form: "washcoated cordierite monolith, 400 cpsi, 2 cm long, 34 channels"}
    # Channel scale for the film mass-transfer refit: Table 9-1 gives the open channel's transverse length
    # (area over perimeter) as 0.275 mm, a 1.1 mm square channel, so wall plus washcoat take 0.17 mm of the pitch.
    monolith: {cpsi: 400, wall_mm: 0.17}
    conditions: >
      Steady state after about 25 min per point, 1000 sccm total in Ar, GHSV about 57,000 1/h (thesis p. 333
      and ch. 9). Pretreated at 500 C in 5% O2. FTIR analyzer (MKS MultiGas 2030).
    ghsv_per_h: 57000
    # The thesis's own global model (Tables 9-3 and 9-4, p. 346): activation energies of standard SCR (step S4)
    # and ammonia oxidation to N2 (S2). Its rates use NH3 coverage and mole fractions per washcoat volume, so
    # only the activation energies compare directly with a fit of the engine's rate laws.
    published_Ea_kJ:
      fe_zsm5: {scr: 72.4, nh3_ox_n2: 90.8}
      cu_cha: {scr: 89.1, nh3_ox_n2: 178.8}
    published_model: thesis model (washcoat diffusion resolved)

  xie2026:
    cite: >
      X. Xie, J. Yuan, L. Liu, H. Liu and Z. Sun, "Dual kinetic effect from confined iron nanoparticles in zeolite
      modulates high-temperature catalytic NO reduction and NH3 oxidation", Ind. Chem. Mater. 4 (2026) 457-471,
      doi:10.1039/d5im00245a. Open access under CC BY-NC 4.0.
    url: https://doi.org/10.1039/d5im00245a
    # The publisher's site sits behind a browser check: save the article as cache/xie2026.pdf and the supplementary
    # information as cache/xie2026_si.pdf by hand.
    pdf: null
    catalysts:
      fe01_zsm5: {name: 0.1Fe@ZSM-5, form: "ion-exchanged powder (0.1 wt% Fe target, Si/Al 27), quartz fixed bed"}
    conditions: >
      Quartz fixed bed, 2 L/min, GHSV 30,000 1/h, IR analyzer, each point averaged over 20 min at steady state.
      SCR feed 1000 ppm NO, 1000 ppm NH3, 6% O2, N2 balance, no water. Ammonia oxidation runs feed 500 ppm NH3:
      the figures give 140 ppm NH3 left and a 5% NOx share at 700 C, and 20 ppm NOx out, which only a 500 ppm feed
      fits (Fig. 3c against Fig. 5b-c).
    ghsv_per_h: 30000
    # Supplementary Table S4: the paper's own kinetics for 0.1Fe@ZSM-5, fitted to points under 15% conversion
    # with intraparticle diffusion checked negligible.
    published_Ea_kJ:
      fe01_zsm5: {scr: 52.12, nh3_ox_n2: "98.3 (all NH3 oxidation)", nh3_ox_no: "98.3 (all NH3 oxidation)"}
    published_model: paper's model (points under 15% conversion)

  odenbrand2017:
    cite: >
      C. U. I. Odenbrand, "High Temperature and High Concentration SCR of NO with NH3 for the Oxyfuel Combustion
      Process: Fitting of Kinetics to Data from a Laboratory Reactor Experiment", Top. Catal. 60 (2017) 1317-1332,
      doi:10.1007/s11244-017-0817-x. Open access under CC BY 4.0.
    url: https://doi.org/10.1007/s11244-017-0817-x
    # The publisher's site sits behind a browser check: save the article as cache/odenbrand2017.pdf by hand.
    pdf: null
    catalysts:
      v_commercial: {name: Commercial vanadia, form: "commercial vanadia-on-titania catalyst, about 0.4 wt% V2O5 (the paper likens it to commercial V2O5-WO3/TiO2), crushed to 0.71-0.80 mm, 1.5 cm3 fixed bed"}
    conditions: >
      Gold-plated steel fixed bed at 2.2 bar, 180 NL/h (GHSV 120,000 1/h at NTP), steady state after 10-45 min.
      Oxyfuel flue-gas feed: 5000 ppm NO, 5500 ppm NH3, 13.06% O2, 5.03% H2O (N2 balance in the paper's model).
      Inlet stepped from 570 to 800 K in 25 K steps; each point is plotted at the bed-exit temperature. Ammonia is
      scrubbed out before the analyzers: NO by chemiluminescence, N2O by NDIR.
    ghsv_per_h: 120000
    pressure_kPa: 220
    # Table 5, fitted by hand in a 3-D reactor model with heat release and flow: SCR, NH3 oxidation to NO, and N2O
    # from NH3 oxidation (plus N2O from NO + NH3 at 110 kJ/mol). Every rate carries NH3 coverage a*C/(1 + a*C) with
    # a = 9e-9 m3/mol x exp(139 kJ/mol / RT).
    published_Ea_kJ:
      v_commercial: {scr: 85, nh3_ox_no: 200, nh3_ox_n2o: 190}
    published_model: paper's 3-D reactor model (heat release resolved)

