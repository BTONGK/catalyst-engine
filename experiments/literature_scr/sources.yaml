# What replicate.py fits. Each dataset pairs a catalyst's runs (one bench step per run, read from the figures above),
# the pathways whose rate constant and activation energy are fitted (the rest are switched off), the reading error,
# and the held-out test: points at or above `from_C` in the listed runs are left out of the second fit and predicted.
# The main fit keeps the pack's NH3 coverage on the SCR site; each alternative refits all points under a different
# model choice, to show how much that choice moves the answer: more or fewer fitted parameters (`add`, `drop`),
# parameters held at given values (`fixed`), or film mass transfer to the monolith wall (`film`, from the source's
# channel geometry; the Gate 1 screen then runs on the intrinsic rates).
datasets:
  - id: metkar2012_fe_zsm5
    source: metkar2012
    catalyst: fe_zsm5
    runs:
      - {step: nh3_ox, figure: metkar2012_fig9-3a, series: NH3}
      - {step: scr, figure: metkar2012_fig9-5, series: Fe-ZSM-5}
    fit: [scr, nh3_ox_n2]          # ammonia burns to N2 alone here (the N2 readings close the balance)
    error: {sigma_abs_ppm: 5, sigma_rel: 0.03}
    holdout: {from_C: 500, runs: [nh3_ox, scr], label: "Fit below 500 °C, predict above"}
    alternatives:
      - {label: "Ammonia coverage fitted", add: [scr.cov.NH3.ln_K_ref, scr.cov.NH3.dH_kJ]}
      - {label: "Film mass transfer included", film: true}
    checks: [n2_balance]
  - id: metkar2012_cu_cha
    source: metkar2012
    catalyst: cu_cha
    runs:
      - {step: nh3_ox, figure: metkar2012_fig9-3b, series: NH3}
      - {step: scr, figure: metkar2012_fig9-5, series: Cu-chabazite}
    fit: [scr, nh3_ox_n2]
    error: {sigma_abs_ppm: 5, sigma_rel: 0.03}
    holdout: {from_C: 500, runs: [nh3_ox, scr], label: "Fit below 500 °C, predict above"}
    alternatives:
      - {label: "Ammonia coverage fitted", add: [scr.cov.NH3.ln_K_ref, scr.cov.NH3.dH_kJ]}
      - {label: "Film mass transfer included", film: true}
    checks: [n2_balance]
  - id: xie2026_fe01_zsm5
    source: xie2026
    catalyst: fe01_zsm5
    runs:
      - {step: nh3_ox, figure: xie2026_fig5b, series: NH3}
      - {step: nh3_ox, figure: xie2026_fig5c, series: NOx share}
      - {step: scr, figure: xie2026_fig5d, series: NO conversion}
    fit: [scr, nh3_ox_n2, nh3_ox_no]   # NOx counts as NO; N2O stays near 1 ppm (Fig. 3d-e)
    # NOx leaves the ammonia-only run beside unburned ammonia from 600 C up, which needs SCR to slow as ammonia
    # desorbs: the comparison fits the SCR site's ammonia coverage.
    alternatives:
      - {label: "Ammonia coverage fitted", add: [scr.cov.NH3.ln_K_ref, scr.cov.NH3.dH_kJ]}
    error: {sigma_abs_ppm: 15, sigma_rel: 0.05}   # the error bars run about ±20 ppm NH3 and ±3-5 points of conversion
    # The bench yardstick's logic: the ammonia-only run at every temperature plus SCR below 700 C predicts SCR above.
    holdout: {from_C: 700, runs: [scr], label: "Fit the ammonia run and SCR below 700 °C, predict SCR above"}
    checks: [nox_two_figures]
  - id: odenbrand2017_vanadia
    source: odenbrand2017
    catalyst: v_commercial
    runs:
      - {step: scr, figure: odenbrand2017_fig2, series: NO}
      - {step: scr, figure: odenbrand2017_fig3, series: N2O}
    fit: [scr, nh3_ox_no, nh3_ox_n2o]   # the paper's own scheme; ammonia is scrubbed out before the analyzers
    error: {sigma_abs_ppm: 0.5, sigma_rel: 0.04}   # 1 px is about 5 ppm NO and 0.02 ppm N2O on these figures
    holdout: {from_C: 460, runs: [scr], label: "Fit below 460 °C, predict above"}
    alternatives:
      - {label: "Ammonia coverage fitted", add: [scr.cov.NH3.ln_K_ref, scr.cov.NH3.dH_kJ]}
      # Table 5's adsorption constant, a = 9e-9 m3/mol x exp(139 kJ/mol / RT), at the pack's 1,050 F reference.
      - label: "Paper's ammonia adsorption"
        fixed: {scr.cov.NH3.ln_K_ref: 1.407, scr.cov.NH3.dH_kJ: -139}
        note: "Ammonia coverage held at the paper's fitted adsorption constant (Table 5)."
