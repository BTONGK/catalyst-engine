    catalyst: fe01_zsm5
    feed: {NH3: 500 ppm, O2: 6 %, N2: balance}
    x: {ticks: [500, 550, 600, 650, 700, 750, 800, 850], unit: C}
    y: {ticks: [0, 100, 200, 300, 400, 500], unit: ppm}
    opening: 6
    size: [10, 30]
    exclude: [[1015, 25, 1055, 65]]   # legend marker
    series:
      - {name: NH3, color: [157, 55, 255], quantity: out_NH3_ppm}
  - id: xie2026_fig5c
    source: xie2026
    label: "Figure 5c: ammonia oxidation on 0.1Fe@ZSM-5, share of ammonia burned to NOx"
    page: 8
    image: 0
    crop: [1380, 0, 2013, 520]
    catalyst: fe01_zsm5
    feed: {NH3: 500 ppm, O2: 6 %, N2: balance}
    x: {ticks: [500, 550, 600, 650, 700, 750, 800, 850], unit: C}
    y: {ticks: [0.0, 0.1, 0.2, 0.3], unit: fraction}
