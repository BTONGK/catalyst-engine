    page: 393
    image: 1
    catalyst: cu_cha
    feed: {NH3: 500 ppm, O2: 5 %, H2O: 2 %, N2: balance}
    x: {min: 100, max: 600, unit: C}
    y: {min: 0, max: 600, unit: ppm}
    series:
      - {name: NH3, color: black, shape: triangle, quantity: out_NH3_ppm}
