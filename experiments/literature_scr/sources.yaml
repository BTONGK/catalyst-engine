    label: "Figure 2: SCR at 5000 ppm NO on commercial vanadia, NO out"
    page: 7
    image: 0
    catalyst: v_commercial
    feed: {NO: 5000 ppm, NH3: 5500 ppm, O2: 13.06 %, H2O: 5.03 %, N2: balance}
    t_step_C: 0.1   # each point sits at its own bed-exit temperature
    x: {ticks: [620, 640, 660, 680, 700, 720, 740, 760, 780, 800, 820], unit: K}   # the 600 tick sits on the frame line
    y: {ticks: [200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000, 2200, 2400, 2600, 2800, 3000, 3200, 3400, 3600, 3800], unit: ppm}
    exclude: [[1290, 20, 1480, 130]]   # legend (its lettering holds rings)
