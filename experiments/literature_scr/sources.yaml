    catalyst: fe_zsm5
    feed: {NH3: 500 ppm, O2: 5 %, H2O: 2 %, N2: balance}   # balance is Ar in the source; both are inert here
    x: {min: 100, max: 600, unit: C}
    y: {min: 0, max: 600, unit: ppm}
    series:
      - {name: NH3, color: black, shape: triangle, quantity: out_NH3_ppm}
      - {name: N2, color: black, shape: circle, quantity: out_N2_ppm}
  - id: metkar2012_fig9-3b
