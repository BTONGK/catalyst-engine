  - {cite: "Nørskov, J. K., Bligaard, T., Logadottir, A., Kitchin, J. R., Chen, J. G., Pandelov, S. & Stimming, U. Trends in the exchange current for hydrogen evolution. J. Electrochem. Soc. 152, J23 (2005).", url: "https://doi.org/10.1149/1.1856988"}
  - {cite: "Man, I. C. et al. Universality in oxygen evolution electrocatalysis on oxide surfaces. ChemCatChem 3, 1159 (2011).", url: "https://doi.org/10.1002/cctc.201000397"}
  - {cite: "Revisiting trends in the exchange current for hydrogen evolution (2021); arXiv:2109.04219, with its Tables S2 and S3 of hydrogen free energies and measured exchange currents.", url: "https://arxiv.org/abs/2109.04219"}
  - {cite: "Kulkarni, A., Siahrostami, S., Patel, A. & Nørskov, J. K. Understanding catalytic activity trends in the oxygen reduction reaction. Chem. Rev. 118, 2302 (2018).", url: "https://doi.org/10.1021/acs.chemrev.7b00488"}
