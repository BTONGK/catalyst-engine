    role: primary
    short: Herron et al. 2015
    quantity: Free energy of each adsorbed intermediate at 0 V
    unit: eV against N2(g) and the hydrogen electrode (H2O(g) and OH-)
    surfaces: close-packed faces, 1/9 monolayer
    source: "J. A. Herron, P. Ferrin, M. Mavrikakis, Electrocatalytic oxidation of ammonia on transition-metal surfaces: a first-principles study, J. Phys. Chem. C 119, 14692 (2015)"
    doi: 10.1021/jp512981f
    url: https://www.osti.gov/biblio/1405312
    reference_gases: {N: 0.5 N2, NH: 0.5 N2 + 0.5 H2, NH2: 0.5 N2 + H2, NNH: N2 + 0.5 H2, HNNH: N2 + H2, NNH2: N2 + H2, HNNH2: N2 + 1.5 H2}
    nh3_gas_eV: -0.36
    columns: [N, NH, NH2, NNH, HNNH, NNH2, HNNH2, H2NNH2]
    app: {N: N, NH: NH, NH2: NH2, NNH: NNH, HNNH: HNNH, NNH2: NNH2, HNNH2: HNNH2}   # column -> the app's intermediate
