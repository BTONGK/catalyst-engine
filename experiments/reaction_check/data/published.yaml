      Ir: [0.13, -0.37, -0.28, 0.82, 0.68, 0.61, 0.29, 0.42]
      Co: [-0.11, -0.50, -0.27, 0.82, 0.69, 0.41, 0.61, 0.99]
      Rh: [-0.14, -0.39, -0.36, 0.89, 0.65, 0.48, 0.31, 0.53]
