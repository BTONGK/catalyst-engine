# Published zero-point and entropy terms from one source that tabulates both the adsorbates' and the gases' terms
# (PASS_RULE.md, batch 2): each correction is the adsorbate's ZPE - TS less its reference gases', heat capacity set
# aside, the convention of the corrections section.
corrections:
  - short: Peterson et al. 2010, via Hansen et al. 2013
    source: "H. A. Hansen, J. B. Varley, A. A. Peterson, J. K. Nørskov, Understanding trends in the electrocatalytic activity of metals and enzymes for CO2 reduction to CO, J. Phys. Chem. Lett. 4, 388 (2013), Supporting Information, Table S1"
    via: "the values of A. A. Peterson, F. Abild-Pedersen, F. Studt, J. Rossmeisl, J. K. Nørskov, Energy Environ. Sci. 3, 1311 (2010), on Cu(211), as Table S1 reproduces them"
    doi: 10.1021/jz3021155
    url: https://acs.figshare.com/articles/journal_contribution/Understanding_Trends_in_the_Electrocatalytic_Activity_of_Metals_and_Enzymes_for_CO_sub_2_sub_Reduction_to_CO/2022342
    surface: Cu(211)
    temperature_K: 291.65   # the table's 18.5 C
    terms: [ZPE, -TS]   # eV; the table's heat-capacity column stays aside
    adsorbates: {COOH: [0.62, -0.18], CO: [0.19, -0.15]}
    gases: {H2: [0.27, -0.39], CO2: [0.31, -0.65], CO: [0.14, -0.60], H2O: [0.58, -0.65]}   # water at 0.035 atm
