# Published per-metal tables the reaction check scores the app against (rule: ../PASS_RULE.md).
# Declared 2026-10-25 before any new pack's prediction was computed. Each table names the pack it checks, its role
# (primary: scored by the pass rule; secondary: shown beside the primary; indicative: shown, outside the pass rule),
# the source and the route by which its numbers reached this file, the conditions, and the values.
# Papers stay outside the repository; these are the digitized numbers with their citations.

thermal:
  - pack: nh3_synthesis
    role: primary
    short: Ozaki 1981
    quantity: Ammonia made per metal atom
    unit: 1e-5 mol NH3 per mol metal per s
    higher_is_better: true
    temperature_K: 573
    conditions: Potassium-promoted metals on carbon, 600 Torr of 3 H2 + N2; equal dispersion assumed for every metal.
    source: "A. Ozaki, Development of alkali-promoted ruthenium as a novel catalyst for ammonia synthesis, Acc. Chem. Res. 14, 16 (1981)"
    via: "H. Toulhoat, P. Raybaud, V. Mendez, E. Puzenat, arXiv:1812.09531 (version 1), supplementary Table ST.4.1"
    url: https://arxiv.org/abs/1812.09531v1
    values: {Pt: 0.0387, Ni: 0.0582, Co: 0.5846, Ir: 3.24, Rh: 1.327, Ru: 56.2, Os: 26.4, Re: 1.66, Fe: 0.9973, Mo: 1.428}

  - pack: nh3_decomposition
    role: primary
    short: Ganley et al. 2004
    quantity: Turnover frequency
    unit: 1/s
    higher_is_better: true
    temperature_K: 853
    conditions: Metals on activated alumina, pure ammonia at 1 atm, differential conversion, rates per surface site.
    source: "J. C. Ganley, F. S. Thomas, E. G. Seebauer, R. I. Masel, A priori catalytic activity correlations: the difficult case of hydrogen production from ammonia, Catal. Lett. 96, 117 (2004)"
    via: "arXiv:1812.09531 (version 1), supplementary Table ST.4.3"
    url: https://arxiv.org/abs/1812.09531v1
    values: {Cu: 0.0130, Pd: 0.0194, Pt: 0.0226, Ir: 0.786, Rh: 2.26, Ni: 4.21, Ru: 6.85, Co: 1.33, Fe: 0.327, Cr: 0.0220}
    outside_run: {Cr: chromium sits outside the 16-metal run}

  - pack: water_gas_shift
    role: primary
    short: Grenoble et al. 1981
    quantity: Order of turnover numbers (1 = most active)
    unit: rank
    higher_is_better: false
    order_only: true
    temperature_K: null   # the review that carries the order gives no temperature; the pack's reference temperature serves
    conditions: Metals on alumina; the review reports the order of turnover numbers.
    source: "D. C. Grenoble, M. M. Estadt, D. F. Ollis, The chemistry and catalysis of the water gas shift reaction: 1. The kinetics over supported metal catalysts, J. Catal. 67, 90 (1981)"
    via: "Mini review of water-gas shift chemistry, arXiv:1409.7976, page 1"
    url: https://arxiv.org/abs/1409.7976
    values: {Cu: 1, Re: 2, Co: 3, Ru: 4, Ni: 5, Pt: 6, Os: 7, Au: 8, Fe: 9, Pd: 10, Rh: 11, Ir: 12}

  - pack: co_methanation
    role: primary
    short: Bligaard et al. 2004
    quantity: Methane made per metal atom (activity A1)
    unit: mmol CH4 per mol metal per s
    higher_is_better: true
    temperature_K: 550
    conditions: Metals on alumina-stabilized magnesia (Mg/Al = 7), CO and H2.
    source: "T. Bligaard, J. K. Nørskov, S. Dahl, J. Matthiesen, C. H. Christensen, J. Sehested, The Brønsted–Evans–Polanyi relation and the volcano curve in heterogeneous catalysis, J. Catal. 224, 206 (2004)"
    via: "arXiv:1812.09531 (version 1), supplementary Table ST.8.3"
    url: https://arxiv.org/abs/1812.09531v1
    values: {Ir: 0.694, Pd: 0.136, Pt: 0.126, Co: 18.2, Ni: 3.43, Fe: 3.81, Re: 1.30, Ru: 18.2, Rh: 4.09}
    left_out: {Cu: "the table's copper value (0.03) is estimated from the A2 set, so it leaves the comparison"}

  - pack: co_methanation
    role: secondary
    short: Vannice 1977
    quantity: Turnover frequency (activity A2)
    unit: 1/s
    higher_is_better: true
    temperature_K: 548
    conditions: Metals on silica; methane made per CO adsorbed site.
    source: "M. A. Vannice, Catalytic synthesis of hydrocarbons from H2-CO mixtures over the group VIII metals. V. The catalytic behavior of silica-supported metals, J. Catal. 50, 228 (1977)"
    via: "arXiv:1812.09531 (version 1), supplementary Table ST.8.1"
    url: https://arxiv.org/abs/1812.09531v1
    values: {Cu: 1.5e-5, Ir: 7.9e-4, Pd: 3.0e-4, Pt: 1.6e-3, Co: 0.87, Ni: 1.8e-2, Fe: 0.16, Ru: 0.27, Rh: 7.3e-3}
    left_out: {Re: "the table's rhenium value is estimated from the A1 set, so it leaves the comparison"}

  - pack: ethane_hydrogenolysis
    role: primary
    short: Sinfelt, in Bond 2005
    quantity: Rate at 478 K from each metal's Arrhenius parameters, ln(r) = ln A - E / (R T)
    unit: ln(molecules per cm2 per s)
    higher_is_better: true
    temperature_K: 478
    conditions: >
      Metals on silica, ethane and hydrogen at Sinfelt's standard pressures (0.030 atm ethane, 0.20 atm hydrogen);
      A in molecules per cm2 per s with 1e15 sites per cm2. 478 K (205 °C) is Sinfelt's own comparison temperature,
      inside the range his measurements span (425 to 627 K).
    source: "J. H. Sinfelt, ethane hydrogenolysis on silica-supported metals (Bond's references 24-27)"
    via: "G. C. Bond, Metal-Catalysed Reactions of Hydrocarbons (Springer, 2005), Table 13.2"
    arrhenius: {Co: [125, 58.7], Ni: [170, 73.0], Rh: [176, 73.1], Pd: [243, 77.3], Os: [146, 71.0], Ir: [151, 66.1]}
    left_out: {Ru: "the table's ruthenium entry comes from another laboratory", Pt: "the table's platinum entry comes from another laboratory"}

  - pack: benzene_hydrogenation
    role: primary
    short: Toulhoat and Raybaud 2003
    quantity: Turnover frequency as tabulated
    unit: as tabulated
    higher_is_better: true
    temperature_K: 303
    conditions: Metals on gamma-alumina.
    source: "H. Toulhoat, P. Raybaud, Kinetic interpretation of catalytic activity patterns based on theoretical chemical descriptors, J. Catal. 216, 63 (2003)"
    via: "arXiv:1812.09531 (version 1), supplementary Table ST.7.1"
    url: https://arxiv.org/abs/1812.09531v1
    values: {Cu: 2.3, Pd: 6.5, Pt: 139.6, Ir: 117.5, Os: 331.1, Co: 231.8, Ni: 56.0, Ru: 42.0, Re: 35.5}

  - pack: ethylene_hydrogenation
    role: indicative
    short: Bond 2005, Table 7.3
    quantity: Temperature listed for each metal (read here as the temperature of equal rate; lower = more active)
    unit: K
    higher_is_better: false
    temperature_K: 250
    conditions: >
      Metals on silica, one laboratory (Bond's reference 51), with the same activation energy, 35 kJ/mol, listed
      for every metal. The text reached here leaves the meaning of the temperature column unconfirmed, so the table
      stays outside the pass rule.
    source: "Bond's reference 51 (ethene hydrogenation on silica-supported metals)"
    via: "G. C. Bond, Metal-Catalysed Reactions of Hydrocarbons (Springer, 2005), Table 7.3"
    values: {Fe: 303, Co: 213, Ni: 233, Cu: 353, Ru: 203, Rh: 197, Pd: 243}

electro:
