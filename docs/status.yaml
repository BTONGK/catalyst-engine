headline: >
  Prove AI finds far better catalysts on high-temperature SCR, then show the same engine
  finds catalysts for each new reaction faster.

proof_sequence:
  - step: Hot SCR
    goal: AI-proposed catalysts beat the commercial reference on the bench (Gates 1 and 4)
    status: building
  - step: Engine oxidation catalyst
    goal: Same rig and FTIR; the shared model finds a winner in fewer experiments
    status: planned
