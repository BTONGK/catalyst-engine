findings:
  - title: Predicted speed ratios run wider than measured ones
    detail: >
      The rule scores order, and the passing reactions order the metals well. The sizes run wide: across the
      measured tables, the fastest and slowest scored metals sit 0.8 to 6.1 powers of ten apart, and the predictions
      put them 7.7 to 40.3 powers of ten apart, 1.3 to 20 times as many. Likely reasons: the volcano's slopes describe
      the close-packed face while working catalysts also run on steps and edges, and a laboratory's slowest readings
      sit near its detection limit. Read a predicted ratio beyond about tenfold as a place in the order.
    source: experiments/reaction_check (2026-10-25); Methodology tab, the reaction check section.
  - title: Propane and propylene combustion miss one laboratory's measured order
    detail: >
      Against Lee's seven alumina-supported metals (2017 thesis, platinum the catalyst to beat), the average of
      carbon and oxygen binding orders the other six with rho 0.17 for propane and 0.49 for propylene, both short of
      the 0.6 the rule asks. Palladium, measured second, sits first in both predictions; copper sits second there
      and measures fifth and fourth; silver sits last there and measures second for propane. The thesis's own
      volcano uses DFT binding energies from Peela et al. 2013, where copper and platinum hold oxygen alike.
    source: experiments/reaction_check (2026-10-25); Methodology tab, limits.
  - title: Two older rankings miss their measured tables
    detail: >
      Ammonia synthesis orders Ozaki's K-promoted metals with rho 0.40 over 9 metals (p 0.15), and water-gas shift
      orders Grenoble's metals on alumina with rho −0.53 over 11, where the strong oxygen binders Re, Co and Ru lead.
      Both move to the playground under the rule; on_design_page in each pack.yaml brings one back.
    source: experiments/reaction_check (2026-10-25); each pack.yaml's comment.
  - title: Oxides belong in UMA's materials mode, at about 0.2 eV
    detail: >
      On 720 molecules on oxide surfaces from OC22, set against its DFT, the typical miss is 0.64–0.70 eV in the
      catalysis mode, 0.19–0.21 eV in the materials mode and 0.14–0.19 eV in UMA-S 1.2.1's oxide mode, which trained
      on OC22. On anatase titania the materials mode binds ammonia at 1.16 eV against the measured 1.23 ± 0.1; the
      catalysis mode at 0.50. All modes sit beyond the 0.11 eV the error bar allows, yet the materials mode orders
      97% of clearly separated surface pairs as DFT does. 1.2.1's modes give gas molecules energies 0.2–1.6 eV off
      their surfaces, so binding against gas shifts there.
    source: Oxide check, experiments/oxide_check (2026-10-23); Methodology tab, limits.
  - title: UMA misplaces ammonia in copper zeolites by 0.4 eV or more
    detail: >
      Ammonia on four sites of copper chabazite, built on the Materials Project framework and relaxed in each UMA
      mode, against two DFT studies (Nystrom et al. 2018; Isapour et al. 2026). Catalysis mode: −1.24 eV on the acid
      site against −1.62, −0.83 on Cu2+ against −1.2 to −1.5, about the dispersion attraction it leaves out.
      Materials mode: within 0.1 eV on the acid site and Cu2+, 0.53 eV too strong on Cu+. Porous-frameworks mode:
      0.2 to 1.2 eV too strong everywhere. Zeolites stay out of the app until a mode passes.
    source: experiments/zeolite_check/ (2026-10-23); Manual, Methodology tab, limits.
  - title: The catalysis mode treats iron as spin-free
    detail: >
      Stretched from its bcc cell to fcc, iron in the catalysis mode drops 0.26 eV per atom; the materials mode,
      with spin, keeps bcc lowest (fcc 0.14 eV per atom higher), as for real iron. A symmetric iron slab therefore
      balanced on a ridge and read −5.25 eV for ammonia. Nudged and relaxed with BFGS it reads −0.65 eV, and its
      surface still rearranges toward a spin-free packing. Run iron, cobalt and nickel in the materials mode as well.
    source: experiments/design_method/atomistic_checks.py, stability section (2026-10-23); Methodology tab, step 4.
  - title: The volcano's peak moves with temperature
    detail: >
      With the peak following the gas, the example's CO oxidation screen moves its peak 0.38 eV toward stronger
      binding from 50 to 350 °C. Platinum keeps the lead throughout; PdPt climbs to 0.61 times platinum's speed at
      350 °C, and rhodium from 1 in 520 billion to 1 in 130 million. With the weak side at 0.9, silver led from 50
      to 80 °C; the splitting slope of 1.8 (2026-10-25) drops it to 9th. A pair that binds alike stays tied at every temperature: on hot SCR, V2O5's layered face and
      copper metal hold ammonia within 0.01 eV of each other, so V2O5 keeps a hair's lead from 0 to 350 °C. The
      copper that beats vanadia below 300 °C in practice sits as single ions in a zeolite, which UMA describes
      0.38 eV or more away from published DFT (Methodology tab, limits).
    source: Example screen, examples/screens/; Manual, Methodology tab, step 6 (2026-10-23).
  - title: For CO oxidation the example screen keeps platinum on top, with PdPt inside its error bar
    detail: >
      Fourteen materials, 56 relaxations, 12 minutes on this Mac (recomputed after the surface and relaxation fixes).
      PdPt, now with a mixed Pd/Pt surface, runs at 0.14 times platinum's rate (likely range 0.003 to 6.3 times); Pd, CuPd and CuPt
      follow. Metals that bind oxygen much more strongly (Rh, Ru, Ni, Co) land a billion times slower or more,
      further below platinum than experiments place them: the strong side's slope is generic, and the next step
      sets it per reaction.
    source: Example screen, examples/screens/; Manual, Methodology tab (2026-10-23).
  - title: Measure at the turbine's concentration
    detail: >
      Seven of eight published catalysts place the SCR site's ammonia coverage at 25 ppm and 1,050 °F below the
      pack's 89%. Fitting it moves the Gate 1 placement at 1,050 °F from 0.89 to 0.59 (Fe-ZSM-5), 0.68 to 0.27
      (Cu-chabazite), 0.87 to 0.24 (0.1Fe@ZSM-5) and to below zero (vanadia). The patent's Fe-beta catalysts,
      measured at 50 ppm, pin their placement within about 0.07 across every coverage their data allow; the data
      at 500 ppm or more leave a spread of up to 0.65. The yardstick's 22.5 ppm feed measures where it counts.
    source: Literature checks 2 and 3, experiments/literature_scr (2026-10-23); Metkar 2012, Xie et al. 2026, Odenbrand 2017, US 7,695,703.
  - title: Ammonia burned to N2 caps the hot end
    detail: >
      On the yardstick's design step at 1,050 °F with NH3/NO = 1.0, the patent's four Fe-beta catalysts reach
      0.51–0.64 at 30,000 1/h and top out at 0.67–0.82 with six times the catalyst, the ammonia used up. With
      NH3/NO = 1.4, 1Fe-2.5W-beta reaches 0.93 with three times the catalyst and 0.6Fe-beta 0.94 with six. The
      patent runs its catalysts at NH3/NO 1.2–1.6 for the same reason.
    source: Literature check 3, operating map (2026-10-23).
  - title: The engine reproduces published zeolite and vanadia SCR data
    detail: >
      In its ideal reactor, with four to six fitted numbers per catalyst, the engine matches four published
      catalysts over 100–850 °C: NO conversion within 0.011–0.025 on average for three zeolites, the vanadia's
      NO out within 48 ppm of 5,000 fed, ammonia left in ammonia-only runs within 9–18 ppm of 500.
    source: Literature check, experiments/literature_scr (2026-10-21).
  - title: Measure SCR and the ammonia burn in the operating window
    detail: >
      Fitted below 500 °C, the Metkar zeolites predict 10 of 11 hotter points inside the 90% band. On the two
      high-temperature sources, cooler data miss the hot end: 0.1Fe@ZSM-5's SCR at 700–850 °C reads 0.12 low
      even with its whole ammonia-only run in the fit, and the vanadia's NO at 460–525 °C reads 95 ppm low.
    source: Literature check, held-out tests (2026-10-21).
  - title: Washcoat diffusion carries most of the transport gap
    detail: >
      The gas film alone raises SCR's apparent activation energy on the thesis monoliths a quarter of the way to
      the thesis values (47 to 54 kJ/mol against 72). Adding washcoat diffusion, with an assumed 50 µm coat at 1%
      of the gas diffusivity, brings Fe-ZSM-5 to 79 against 72 for SCR and 91 against 91 for ammonia to N2. The
      fits read worse (reduced chi-square 2.8 to 5.0), so the real coats diffuse faster than assumed. Fine powder,
      or a coated core at two loadings, gives intrinsic rates on the bench.
    source: Literature check 3, washcoat refit (2026-10-23).
  - title: UMA tracks metal chemistry and ranks the SCR acid sites
    detail: >
      On nine metals UMA reproduces the textbook scaling of NHx and OH binding and all 14
      periodic-table orderings. On titania and vanadia both of its modes rank the ammonia sites the
      same way: vanadium hydroxyl (ammonium forms), then titania Ti, then the vanadia Lewis site.
      The materials mode matches the measured ammonia binding on titania, 1.16 eV against
      1.23 ± 0.1. Nitric oxide energies on vanadia read high in both modes, so ammonia binding is the
      descriptor to carry into Phase 5, with the gap between modes as its uncertainty.
    source: UMA test run, experiments/uma_binding (2026-10-21); benchmarks in its README.
  - title: The ammonia test step needs 200 ppm
    detail: >
      At 25 ppm the NO and N2O formed by ammonia burn-off sit at the FTIR noise floor and three
      ammonia-oxidation rates are aliased, like confounded factors in a DOE. At 200 ppm all eight
      SCR parameters come out cleanly (N2O activation energy within about 6 kJ/mol, against about 47
      at 25 ppm).
    source: Simulation with illustrative parameters; confirm on the rig.
  - title: Hot SCR on honeycombs is partly a diffusion problem
    detail: >
      At 1,150 F the NOx reaction runs as fast as NO can reach the channel wall, while ammonia
      burn-off keeps its full chemical rate. A hot catalyst therefore needs a deep cut in
      ammonia oxidation plus a tuned ammonia dose.
    source: Simulation with illustrative parameters.
  - title: The bench gas is set in permit units
    detail: >
      The analysis states 15% O2 and leaves its basis open. The bench recipe reads it as dry, the way
      permits and turbine NOx ranges are quoted, so a wet FTIR reading times 1.11 is ppmvd @ 15% O2
      and a 2.0 ppm permit limit equals 1.80 ppm on the analyzer. The wet reading would have
      needed 1.55 and 1.29 ppm.
    source: Analysis page 20; 40 CFR 60.335; arithmetic. Decided 2026-10-21.
  - title: Rate constants read best near 60-80% conversion
    detail: >
      A 0.5 ppm reading error moves the rate constant about 10% at 92% conversion and about 5%
      near 63%. The yardstick includes a high space-velocity step for this.
    source: Arithmetic.
  - title: Gate 4 needs about 76 formulations per arm
    detail: >
      Telling a 20% hit rate from a 5% hit rate at 95% confidence and 80% power takes about 76
      model picks and 76 expert picks. Batch 1 answers the kill question; the Gate 4 claim builds
      over about six batches.
    source: Two-proportion power calculation.

decisions:
  - item: "Methane combustion keeps palladium as its catalyst to beat (2026-10-25)"
    owner: You
    status: open
    detail: >
      Lee's 2017 thesis measures platinum ahead of palladium on alumina at four O2 per CH4 and palladium ahead in
      fuel-rich gas. The package's screen feed carries twenty O2 per CH4, beyond the thesis's range, and palladium is
      the catalyst of natural-gas engine converters, so the package keeps palladium. Switching to platinum is one
      line in reactions/methane_combustion/pack.yaml; yours to make as catalysis lead.
  - item: "Ammonia synthesis and water-gas shift leave the Design page after failing their ranking check (2026-10-25)"
    owner: You
    status: open
    detail: >
      The rule, written before the results, keeps a reaction on the Design page only while its ranking passes.
      Both failed (rho 0.40 and −0.53), so both run in the Reactions library and the playground. Setting
      on_design_page: true in a pack.yaml brings it back; yours to keep or reverse as catalysis lead.
  - item: "O2 basis for the bench yardstick: dry (decided 2026-10-21)"
    owner: You
    status: closed
    detail: >
      Source: the analysis PDF, page 20, "The yardstick": simulated simple-cycle exhaust with 25 ppm NOx in,
      15% O2 and 10% H2O, the analysis author's own proposal. Dry matches permit units (40 CFR 60.335) and the
      9-25 ppm turbine range the 25 ppm comes from. The bench gas is 22.5 ppm NO, 13.5% O2 and 10% H2O as fed,
      and a 2.0 ppm permit limit equals 1.80 ppm on the analyzer. Decided by you as catalysis lead.
  - item: UMA model access on Hugging Face (granted; uma-s-1p1 checkpoint in ~/uma/checkpoints)
    owner: You
    status: closed
  - item: Ask counsel to review the UMA policy line on critical infrastructure
    owner: You
    status: open
  - item: Materials Project API key (saved in ~/.config/.pmgrc.yaml, outside the repository)
    owner: You
    status: closed
  - item: "NH3/NO step for the bench yardstick (proposed 2026-10-23, replaces the 2026-10-21 concentration step)"
    owner: You
    status: open
    detail: >
      Proposal from Literature check 3: at 950, 1,050 and 1,150 °F with 25 ppm NO, feed NH3/NO at 1.0, 1.2 and 1.4.
      The patent's ammonia steps at fixed NO pinned its best-measured catalyst's coverage to 43–71%; the same steps
      at 25 ppm measure our catalysts' coverage and map Gate 1's operating window in one pass. It replaces the
      earlier NO = NH3 step at 25, 50 and 200 ppm. Yours to accept, change or drop as catalysis lead.
  - item: "Gate 1's ammonia basis: NH3/NO = 1.0, or the NH3/NO that holds slip under a limit (proposed 2026-10-23)"
    owner: You
    status: open
    detail: >
      At NH3/NO = 1.0, Gate 1 rewards ammonia selectivity above all else at the hot end: published Fe-beta tops
      out at 0.67–0.82 at 1,050 °F. Turbine SCR runs above 1.0 under an ammonia slip limit, and the pack's slip
      metric allows 2 ppm. Gate 1 could be set at the NH3/NO that holds slip under a limit you choose.
  - item: Review pack parameters, protocols and the batch-1 design space before batch 1
    owner: You (catalysis lead)
    status: open
  - item: Where the lab store is backed up
    owner: You
    status: open
    detail: >
      Lab records and raw files live in data/lab on this Mac, outside git by design. The prediction log's
      head hash goes into git through `ce data anchor`; the store itself needs a backup location before batch 1.
