    item: >
      Twenty more reactions added (batch 2). Thermal, 10 packages: catalytic hydrogen combustion, cyclohexane
      dehydrogenation, methanol decomposition, propane and propylene combustion, SO2 oxidation, ethylene epoxidation,
      formaldehyde from methanol over silver, ethane dehydrogenation and selective butadiene hydrogenation.
      Electrochemical, 10 reactions: CO2 reduction to methane and to methanol, CO reduction to methane and to
      methanol, CO electro-oxidation, methanol oxidation to CO2 and to formate, formic acid oxidation through
      carboxyl, hydrogen peroxide oxidation and two-electron water oxidation. Every citation was checked on Crossref
      and every gas against Cantera's databases. Thermal: one laboratory's seven-metal table (Lee's 2017 Delaware
      thesis) was declared in PASS_RULE.md and read from its bar charts before the propane and propylene packages
