next_steps:
  - step: Run a design screen on a reaction you care about, and tell me what reads unclear
    owner: You
    why: >
      The Manual's "How to use the app" tab walks through it. Keep the temperature range near the reaction's
      standard test; the app flags ranges beyond it.
  - step: Find measured per-metal tables for the thermal packages in the playground
    owner: Claude
    why: >
      24 thermal packages, 8 of them from batch 2, run in the playground until a table measured in one laboratory
      scores their ranking under the rule. Propane and propylene combustion met one (Lee 2017) and miss it.
  - step: Published free energies for the methanol and methane paths
    owner: Claude
    why: >
      Ferrin 2009's table checks five carbon intermediates but sets each against a gas-phase radical, so the
      rankings of methanol oxidation and of the methane and methanol paths of CO2 and CO reduction wait on a
      published free-energy table on the hydrogen-electrode scale.
  - step: "Nitrate reduction: place NO3* and NO2* and check them against Liu et al. 2019"
    owner: Claude
    why: Nitrate's path to ammonia starts through two intermediates the worker has yet to place.
  - step: Find measured tables for the seven Design-page reactions from before the check
    owner: Claude
    why: >
      CO2 methanation, CO oxidation, methanol from CO2, N2O removal, the gas-engine oxidation catalyst, hot SCR and
      steam reforming rank materials on the Design page on the method's own checks, ahead of a per-metal measured
      table scored under the rule. Each needs one table measured in one laboratory to carry the same backing as the
      new ones.
  - step: Published zero-point and entropy corrections for OCHO*, HNNH*, N2H3*, NO*, NOH* and six carbon intermediates
    owner: Claude, with a download from you
    why: >
      UMA's own vibrations miss the four published corrections by up to 0.20 eV, so these eleven wait; COOH* and CO*
      now take Peterson 2010's values through Hansen 2013. Peterson 2010's own supporting information computes the
      methane path's intermediates on copper and sits behind the publisher's bot check: a copy you download from
      pubs.rsc.org (article c0ee00071j) into experiments/reaction_check/cache/ lets the app check CHO*, CH2O* and
      CH3O*. OCHO*'s value would bring CO2 to formate and formic acid oxidation through formate, whose rankings
      already pass, to the Design page.
  - step: "Surface stability for electrocatalysts: a Pourbaix check per candidate"
    owner: Claude
    why: A candidate that dissolves or oxidizes at the working potential ranks well and fails in the cell.
  - step: Decide how oxide screens run
    owner: You
    why: >
      The oxide check puts the materials mode about three times closer to oxide DFT than the catalysis mode, the
      default, and only the materials mode matches measured ammonia on titania. Hot SCR's catalyst to beat is an
      oxide: vanadium oxide binds ammonia at −0.26 eV in the catalysis mode and −0.52 eV in the materials mode.
      Options: run whole screens of oxides in the materials mode by default, or keep the choice manual with the
      advice the app now gives. Metals stay best in the catalysis mode, and one screen keeps one mode.
  - step: Cut oxide faces at their most stable termination
    owner: Claude
    why: >
      The surface cut keeps the termination whose composition matches the bulk; on anatase (101) that leaves a
      singly bonded oxygen on top, and ammonia binding there swings by up to 1.2 eV between modes. Choosing the cut
      with the fewest broken metal–oxygen bonds gives the real face, as the check's hand-built slab shows.
  - step: Set each reaction's volcano slopes from published scaling relations
    owner: Claude
    why: >
      Four packs now take the splitting slope of 1.8 on the weak side; the strong side keeps a generic 1.0 eV per
      eV in every pack, which pushes metals that bind strongly, such as Rh, Ru, Ni and Co, far below what practice
      shows (rhodium at 1 in 520 billion of platinum's speed for CO oxidation). Reaction-specific strong-side slopes
      and a CO-coverage term for CO oxidation bring the ranking closer to published activity.
  - step: Review the pack parameters and protocols, and set the batch-1 design space
    owner: You
    why: >
      As catalysis lead, your review replaces the illustrative parameters and defines what batch 1 explores.
      The Literature check page gives fitted values for eight published catalysts to compare against, and shows
      the pack's 89% ammonia coverage at 25 ppm as the optimistic case.
  - step: Review the NH3/NO bench step and Gate 1's ammonia basis
    owner: You
    why: >
      An NH3/NO step at 25 ppm NO measures each catalyst's ammonia coverage and maps Gate 1's operating window in
      one pass. Published Fe-beta tops out at 0.67–0.82 with NH3/NO = 1.0, so where Gate 1 sets the ammonia decides
      what a winning catalyst looks like. Both are in your decisions.
  - step: Send a sample export from the rig's analyzer or logger
    owner: You
    why: >
      The Lab data page reads one CSV layout (Add data tab, File format). A real export lets the reader match
      the rig before the first run.
  - step: "Build the virtual rig (Phase 3): hidden catalysts across the batch-1 design space"
    owner: Claude
    why: Runs the whole loop, picks to scores, on simulated catalysts before lab money is spent.
  - step: Ask counsel to review the UMA policy line on critical infrastructure
    owner: You
    why: Clears the atomistic layer for commercial use.
  - step: "Atomistic test 2: vanadia on titania with tungsten or molybdenum"
    owner: Claude
    why: Moves the UMA check from textbook surfaces to the real catalyst family.

