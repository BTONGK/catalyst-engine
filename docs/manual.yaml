# The Manual page (ui/views/manual.py). Written for an everyday user: plain words, short sentences, one action per
# line, the app's own labels in quotes. Every reaction uses the same steps, so the text stays general and uses a
# reaction only as an example. Affirmative phrasing throughout.
# Figures named under preface.sections[].figure are drawn in ui/views/manual.py; step images live in docs/manual/.

preface:
  title: Catalysis in plain words
  intro: >
    A ten-minute read before you use the app. It covers what catalysts are, how they work, how people find new
    ones, and how this app finds them on a computer. Each idea here shows up again on the app's pages.
  sections:
    - title: What a catalyst is
      text: >
        A catalyst is a material that makes a chemical reaction run faster and comes out of the reaction unchanged.
        Because it is used again and again, a small amount can treat a huge amount of gas or liquid for years.
        Catalysts are everywhere:
      points:
        - The catalytic converter in a car turns poisonous exhaust gases into harmless ones.
        - Enzymes in your body are nature's catalysts; they digest a meal in hours.
        - Most nitrogen fertilizer starts as nitrogen from the air, turned into ammonia on an iron catalyst.
        - Gasoline, plastics, hydrogen and many medicines meet a catalyst somewhere along the way.
    - title: How it speeds a reaction up
      figure: energy
      text: >
        Molecules have to climb an energy hill before they can turn into something new. A catalyst offers a lower
        path over the hill, so far more molecules make it across each second. The catalyst changes how fast the
        reaction goes. Where the reaction can end up (its equilibrium) is set by the chemistry itself, so a catalyst
        speeds the trip and leaves the destination the same.
    - title: "Where the work happens: the surface"
      figure: cycle
      text: >
        Most industrial catalysts are solids, and the reaction happens on their surface. Gas molecules land on
        special spots called active sites, meet there, react, and the products drift away. That frees the spot for
        the next molecules, over and over.
      points:
        - More surface means more active sites. That is why catalysts are made as fine, spongy powders full of tiny pores. One gram can hold as much surface as a tennis court.
        - The surface is a neat grid of atoms. The app builds this grid for every material it tries and shows it to you in 3D.
    - title: "The key idea: hold molecules just right"
      figure: volcano
      text: >
        A good catalyst grabs the molecules it works on firmly enough to tear their bonds apart, and lightly enough
        to let the products go. Chemists call this the Sabatier principle. Plot how fast a reaction runs against how
        strongly the surface holds one key molecule, and the points form a volcano: weak holders on one side, strong
        holders on the other, and the best catalysts near the top.
      points:
        - "For many reactions one number, the binding energy of one key atom or molecule, places a material on its volcano. For ammonia it is nitrogen; for most oxidations it is oxygen."
        - "Binding energy is measured in electron volts (eV). More negative means the surface holds on more strongly."
        - "This is how the app ranks materials: it computes the binding energy, finds where each material sits on the volcano, and turns that into a speed."
    - title: How a computer computes binding energy
      figure: screen
      text: >
        Atoms push and pull on each other according to quantum physics. The classic way to compute this, density
        functional theory (DFT), takes hours to days for one surface on a supercomputer. Meta's FAIR Chemistry team
        trained an AI model, UMA, on hundreds of millions of DFT results. UMA gives nearly the same answer in seconds
        to minutes on an ordinary computer.
      points:
        - "The app takes each material's crystal structure, cuts it to show its most common face, and places the key molecule on several spots."
        - "UMA lets the atoms settle into their natural positions, then reads off the energy. The energy of the surface holding the molecule, minus the bare surface and the free molecule, is the binding energy."
        - "The Model accuracy page shows how closely UMA matches published DFT numbers."
    - title: What a catalyst is made of
      text: >
        A real catalyst is a recipe, much like a dish. The app screens the part that does the chemistry; the rest
        comes in when someone makes the catalyst.
      points:
        - "Active ingredient: the part that does the chemistry, usually a metal, an alloy (a mix of metals) or a metal oxide. This is what the app screens."
        - "Support: a porous material that holds the active ingredient spread out thin, such as alumina, titania or a zeolite."
        - "Promoter: a small addition that boosts activity or durability."
        - "Shape: powder or pellets in the lab; in real equipment, often a thin coat on a ceramic honeycomb block (a monolith), so gas flows through easily."
    - title: What makes a catalyst good
      text: >
        A new catalyst has to win on the measures that matter for its job and hold its own on the rest.
      points:
        - "Activity: how much of the incoming gas it converts. Conversion runs from 0 to 1, so 0.92 means 92% converted."
        - "Selectivity and yield: how much of what it converts becomes the product you want."
        - "Durability: how long it keeps working. Heat slowly wears catalysts out, and some trace gases, such as sulfur, coat the active sites."
        - "Cost and supply: precious metals such as platinum work well and cost a lot; abundant metals such as iron, nickel and copper cost little."
    - title: Temperature and the working window
      figure: window
      text: >
        Heat makes reactions faster. A catalyst wakes up around its light-off temperature, then converts more and
        more as it gets hotter. At the hot end, side reactions or the equilibrium can pull the result down again. The
        range in between is the catalyst's working window. A better catalyst lights off at a lower temperature, which
        saves energy and widens the window.
    - title: Contact time and space velocity
      text: >
        Gas spends only a moment inside the catalyst. Space velocity measures this: the volume of gas flowing
        through each hour, divided by the volume of catalyst. A space velocity of 30,000 per hour means the catalyst
        treats 30,000 times its own volume of gas every hour. A lower space velocity means more catalyst and more
        contact time, so higher conversion, at a higher cost.
    - title: How catalysts are tested, in a lab and in this app
      text: >
        In a lab, a small piece of catalyst sits in a heated tube while a gas mix flows through, and an analyzer
        measures what comes out. The tester steps through a list of temperatures and plots the result. This app runs
        the same test as a simulation: a model of the tube, at your gas mix, pressure, flow and temperatures, with each
        material's speed taken from its place on the volcano. The thermodynamics that cap each reaction come from
        standard tables (Cantera's GRI-Mech data).
    - title: Why a computer screen helps
      text: >
        The choices multiply fast: thousands of metals, alloys and oxides, each with its own surface. Making and
        testing one in a lab takes days. A computer screen ranks hundreds in a day, so the lab can focus on the few
        most likely to win.
      points:
        - "The Materials Project, a free database run from Lawrence Berkeley National Laboratory, holds over 150,000 computed crystals. The app searches it by element."
        - "Each prediction comes with a likely range. Two materials whose ranges overlap are a close call."
        - "A screen compares clean, flat surfaces of pure crystals. A lab test of the top few confirms the ranking and adds what a real catalyst brings: edges, supports and long-term durability."
    - title: One app, many reactions
      packs: true
      text: >
        Each reaction lives in the app as a reaction pack: a short file that lists the molecules, the wanted reaction
        and the side reactions, how to judge a good result, the catalyst to beat and the key molecule for the volcano.
        Every page reads from the packs, so the same steps work for any reaction. You can add your own on the
        Reactions page with a short form.
      points:
        - The app is built around solid catalysts working in flowing gas, the most common kind in industry.
        - Other families include catalysts dissolved in a liquid, enzymes, and electrocatalysts, which use electricity to drive reactions such as splitting water into hydrogen.

title: How to use the app
intro: >
  The app designs catalysts on a computer. You tell it what the catalyst should do and which materials to try. It
  builds each material's surface atom by atom, computes how strongly the key molecules stick, predicts how each
  material would perform in a reactor under your conditions, and ranks them against the catalyst to beat. Everything
  runs on this computer; a lab is optional, for confirming the winners.

needs:
  - This computer, with the app installed (it already is).
  - About ten minutes for a first screen of a few metals. Bigger screens run in the background while you do other things.
  - "Optional: a free Materials Project API key, to search 150,000+ crystals for alloys and oxides. Pure metals work right away."

start:
  - title: Open the app
    text: >
      Open the Terminal app: press Command and Space together, type Terminal, then press Return. Copy the two lines
      below, paste them into Terminal and press Return. The app opens in your web browser.
    code: |
      cd ~/catalyst-engine
      uv run ce ui
  - title: Find your way around
    text: >
      The menu on the left lists every page. Start with Home. Design a catalyst, Results and Materials are where
      most of the work happens. The other groups are extras for deeper checks.
  - title: Look at the example
    text: >
      Open Results. It already holds an example screen: carbon monoxide oxidation on nine metals and four alloys,
      against platinum. Click through its tabs to see what a finished screen looks like.

steps:
  - phase: Set up the design
    title: Pick a reaction
    page: Design a catalyst → 1
    image: step-reaction.png
    do:
      - Click "Design a catalyst" in the menu on the left.
      - In part 1, open the "Reaction" list and pick what the catalyst should do. The list groups reactions into clean air, hydrogen and energy, and chemicals and fuels.
      - Read the short summary under it, the reaction itself, the catalyst to beat, and the key molecule the app ranks by. "Why this works" explains the choice.
      - "Beside each reaction the list shows its ranking check: \"checked\" (the app's order of metals agreed with a laboratory's measured order, by a rule written down before the results), \"missed its check\" (the two orders differed), or \"awaiting its check\" (a measured table to score it is still to come). The same verdict sits under the reaction and above its results, with what the check found. Read every ranking as a shortlist to test, and a checked one with the most confidence (Manual, Methodology tab, the reaction check)."
      - Your reaction is elsewhere? Add it on the Reactions page (step 11) and it appears in this list.
    get: The reaction, and the catalyst every material is compared with.
  - phase: Set up the design
    title: Set the conditions
    page: Design a catalyst → 2
    image: step-conditions.png
    do:
      - The settings start at a standard test for the reaction. Change them to match your process.
      - "\"Temperature range\": drag both ends to cover the temperatures you care about."
      - "\"Pressure\" and \"Gas flow per catalyst volume\" (space velocity): type new numbers or keep the defaults."
      - "\"Gas going in\": one gas per row, written as 10 %, 500 ppm, or balance for the gas that fills the rest. Add a row with the + at the bottom of the table."
      - "\"Compare catalysts at\": the temperature for the headline numbers in the results."
      - The chart shows the catalyst to beat (gray) and the most any catalyst could reach (green, dashed). A better catalyst moves the gray curve toward the green one.
    get: One set of conditions for the whole screen, so every material gets the same fair test.
  - phase: Set up the design
    title: Choose materials to try
    page: Design a catalyst → 3
    image: step-candidates.png
    do:
      - "\"Pure metals\" tab: pick metals from the list and press \"Add these metals\". The list starts with metals known to work for this reaction."
      - "\"Search the Materials Project\" tab: pick elements, choose how many to mix (\"Mix up to\") and the kind (alloys or oxides). Tick the rows you want and press \"Add selected\". The first ticked row shows in 3D."
      - Your list sits under the tabs. Tick "Remove" to drop a material. The catalyst to beat joins the screen on its own.
      - Five to ten materials is a good first screen. The Materials page shows more about any crystal before you add it.
    get: Your list of candidate materials.
  - phase: Set up the design
    title: Start the screen
    page: Design a catalyst → 4
    image: step-run.png
    do:
      - "\"How careful\": Quick for a first look, Standard for most screens, Thorough for a final check of a short list."
      - Give the screen a name you will recognize later.
      - Check the time estimate, then press "Start the screen".
      - The app opens the Results page. The screen runs in the background, so you can close the browser or start another design.
    get: A running screen with a progress bar and a time estimate.
  - phase: Read the results
    title: Watch the progress
    page: Results
    image: step-progress.png
    do:
      - The bar shows how many calculations are done and roughly how long is left. The page refreshes itself every few seconds.
      - Rankings appear as soon as the catalyst to beat and one other material finish, and sharpen as more come in.
      - Press "Stop this screen" any time. Finished materials keep their results.
    get: A screen that fills in while you watch, or while you do something else.
  - phase: Read the results
    title: Read the ranking
    page: Results → Ranking
    image: step-ranking.png
    do:
      - The headline names the leader, and the boxes above the table give its key numbers. When the catalyst to beat
        stays on top, as in this example, the headline and the boxes turn to the closest challenger.
      - "\"Speed vs\" the catalyst to beat: 3× faster means three times the reaction rate at the comparison temperature. \"Likely range\" next to it is the spread."
      - "\"At … °C\": the predicted result (conversion or yield) at your comparison temperature."
      - "\"Light-off\": the temperature where the material reaches half of the best possible result. Lower is better."
      - "\"Supply\": abundant, uncommon, scarce or precious, from how common the elements are in Earth's crust."
    get: Your shortlist, with an honest range on every number.
  - phase: Read the results
    title: Compare performance curves
    page: Results → Performance curves
    image: step-curves.png
    do:
      - Each colored line is one material's predicted result across your temperature range. The shaded band around it is its likely range.
      - The gray line is the catalyst to beat. The dashed line is the most any catalyst could reach, set by the reaction's equilibrium.
      - Choose which materials to draw in "Materials to show" above the chart. The dotted line marks the comparison temperature.
    get: The working window of each material, side by side.
  - phase: Read the results
    title: See the volcano
    page: Results → Volcano
    image: step-volcano.png
    do:
      - The curve is this reaction's volcano. Each dot is a material, placed by its computed binding energy.
      - Dots near the peak hold the key molecule just right. Left of the peak, the surface holds too strongly; right of it, too weakly.
      - The bars on each dot show the uncertainty of the computed binding energy.
      - Slide "Draw the volcano at" to another temperature. Heat moves the peak toward materials that hold the key molecule more strongly, so the dots climb or sink, and the leader can change. When it does, a blue note above the tabs names the leader in each part of your range.
    get: Why each material ranks where it does, which direction to move to improve it, and where across your temperatures each one leads.
  - phase: Read the results
    title: Look at the 3D structures
    page: Results → 3D structures
    image: step-3d.png
    do:
      - Pick a material, then a view under "Show" - the clean surface, or the key molecule on each spot tried. The best spot is picked to start.
      - Drag to turn the model, scroll to zoom. The molecule draws larger than the surface atoms so it stands out.
      - The colored dots under the picture name each element.
    get: A picture of exactly what the computer calculated.
  - phase: Read the results
    title: Check the details and download
    page: Results → Details
    do:
      - Every spot the app tried, with its binding energy, how many steps the atoms took to settle, and any notes - such as a molecule that drifted off or split apart. The ranking uses the best settled spot.
      - Press "Download the ranking (CSV)" or "Download every site (CSV)" for spreadsheets of everything.
      - The structures are also saved as CIF files in the screen's folder, ready for other chemistry software.
    get: The full record behind the ranking.
  - phase: Go further
    title: Use the Advanced options
    page: Design a catalyst → Advanced
    image: step-advanced.png
    do:
      - Switch on "Advanced" at the top of Design a catalyst. The four steps stay the same; extra controls join them.
      - "\"Catalyst form\" in step 2: powder (fine grains) or a coated honeycomb (monolith), as in exhaust systems. For a honeycomb, set its cells per square inch and the wall and coat thickness. The app then counts the time gas takes to reach the channel walls, which caps how much a faster catalyst can gain. The space velocity counts per volume of the whole honeycomb block."
      - "\"Face\" column in your list: auto keeps each crystal's close-packed face. Type three Miller indices, such as 1 0 0, to compute another face. A cubic metal reads them in its cubic cell, as textbooks write them."
      - "Step 4: the UMA mode (catalysis for metals and alloys, materials for oxides), the catalyst to beat (any material on your list) and the slab's thickness and width."
      - "Rank like with like. Metals and oxides hold the key molecule through different chemistry, so pick a catalyst to beat from the same family as your candidates: an oxide when you screen oxides."
      - "The Manual's Methodology tab lists what stays outside the model, such as the support, promoters and zeolite sites, with the size of each."
    get: A chosen catalyst form, faces and model settings, read on the same Results pages.
  - phase: Go further
    title: Add your own reaction
    page: Reactions → Add a reaction
    image: step-add-reaction.png
    do:
      - "Part 1: name the reaction and type it, like CH4 + CO2 <=> 2 CO + 2 H2. The app checks that the atoms balance."
      - "Part 2: choose how to judge a result - the conversion of a gas going in, or the yield of a product."
      - "Part 3: pick the key molecule (the app suggests one), the catalyst to beat, and the metals to suggest first."
      - "Part 4: the standard gas mix, pressure, flow and temperature range, plus the temperature where the catalyst to beat converts half of what it could. A paper or a datasheet usually gives this."
      - Press "Add this reaction". It appears in the library and on the Design page right away, marked as awaiting its check.
    get: A new reaction, ready to design for.
  - phase: Go further
    title: Explore materials
    page: Materials
    image: step-materials.png
    do:
      - Search the Materials Project by element, or pick a pure metal.
      - Click a row to see the crystal in 3D with its stability, whether it conducts electricity, its density and how easy its elements are to source.
      - Press "Add to my design list" to send it to step 3 of Design a catalyst. "Download the structure (CIF)" saves the crystal file.
    get: A closer look at any crystal before you screen it.
  - phase: Go further
    title: Ask "what if" in the reactor
    page: Catalyst playground, Design scenarios
    do:
      - The Catalyst playground lets you change a catalyst's speed numbers by hand and watch the predicted curves move.
      - Design scenarios turns a catalyst's speed into the size and cost of a full-scale unit, for exhaust-cleaning reactions.
    get: A feel for how much a better catalyst is worth.

