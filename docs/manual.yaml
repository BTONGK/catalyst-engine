tips:
  - Start with Quick care and a handful of materials. Rerun the top three on Thorough.
  - Include a material you already know works. When it lands near the top, the screen is behaving.
  - Read the ranges. Two materials whose ranges overlap are a close call; let a lab test decide.
  - Prefer stable crystals (stability near 0 eV/atom). Those are the ones a lab can make.
  - Weigh supply too. A material a little slower than platinum and made of abundant metals is often the better buy.
  - Screens keep running when you close the browser. The Results page picks them up again.

glossary:
  - group: Chemistry words
    terms:
      - {term: Catalyst, means: "A material that speeds up a reaction and comes out unchanged."}
      - {term: Active site, means: "A spot on the catalyst's surface where molecules land and react."}
      - {term: Adsorbate, means: "A molecule or atom stuck to a surface."}
      - {term: Binding energy, means: "How strongly a surface holds a molecule, in eV. More negative means a stronger hold."}
      - {term: Sabatier principle, means: "The best catalyst holds molecules just right: firmly enough to react, lightly enough to let go."}
      - {term: Volcano, means: "The peaked curve of speed against binding energy that the Sabatier principle predicts."}
      - {term: Equilibrium, means: "The furthest a reaction can go at a given temperature and pressure, whatever the catalyst."}
      - {term: Alloy, means: "A solid mix of two or more metals, such as copper with palladium."}
      - {term: Oxide, means: "A compound of a metal with oxygen, such as vanadium oxide (V2O5)."}
      - {term: Crystal structure, means: "The repeating 3D pattern of atoms in a solid."}
      - {term: Surface (facet), means: "One flat face of a crystal. The app uses each crystal's most tightly packed face, the most common one on real particles; Advanced lets you choose another."}
      - {term: Miller indices, means: "Three whole numbers that name a crystal face, such as (111), the close-packed face of platinum."}
      - {term: Zeolite, means: "A crystal of silicon and oxygen full of molecule-sized pores. Aluminium in place of some silicon lets it hold a proton or a metal ion, where molecules react."}
      - {term: Monolith (honeycomb), means: "A ceramic block of thin parallel channels whose walls carry a coat of catalyst; gas flows straight through."}
      - {term: Support, means: "The porous material that carries the active ingredient."}
      - {term: Conversion, means: "The share of a gas the catalyst turns into something else. 0.92 means 92%."}
      - {term: Yield, means: "How much wanted product comes out per unit of a gas going in."}
      - {term: Selectivity, means: "The share of the converted gas that becomes the wanted product."}
      - {term: Light-off, means: "The temperature where a catalyst reaches half of its best result."}
      - {term: Space velocity, means: "Gas volume per hour divided by catalyst volume. Lower means more contact time."}
      - {term: Activation energy, means: "The height of the energy hill. It sets how quickly a reaction speeds up with heat."}
      - {term: ppm, means: "Parts per million: 1 ppm is one molecule in a million."}
  - group: App and model words
    terms:
      - {term: Screen, means: "One run of the app over a list of materials for one reaction and one set of conditions."}
      - {term: Candidate, means: "A material in a screen."}
      - {term: Catalyst to beat (reference), means: "The known catalyst every candidate is compared with. Its result anchors the volcano, so model errors shared by all materials cancel."}
      - {term: Key molecule (descriptor), means: "The atom or molecule whose binding energy places a material on the volcano."}
      - {term: Best possible, means: "The result of an ideal, infinitely fast catalyst: the reaction's equilibrium or full conversion."}
      - {term: Likely range, means: "The spread of a prediction from the uncertainty of the binding energy (about 0.15 eV) and, away from the reaction's anchor temperature and feed, from how far the volcano's peak moves. The app finds the slowest and fastest case exactly."}
      - {term: How careful (care level), means: "How many surface spots the app tries per molecule and how tightly the atoms settle."}
      - {term: Reaction pack, means: "One reaction's file: its molecules, reactions, how to judge results, and how to rank materials."}
      - {term: Ranking check, means: "The app's order of metals for a reaction set against one laboratory's measured order, under a rule written down before the results. Its verdict, checked, missed or awaiting, sits beside the reaction on the Design page and above its results."}
      - {term: UMA, means: "Universal Model for Atoms, Meta FAIR Chemistry's AI model of how atoms push and pull, trained on DFT results."}
      - {term: DFT, means: "Density functional theory, the standard quantum-physics method for computing atoms' energies."}
      - {term: Materials Project, means: "A free online database of over 150,000 computed crystals, at materialsproject.org."}
      - {term: Stability (eV/atom), means: "How far a crystal sits above the most stable mix of its elements. 0 is the most stable; up to about 0.05 can usually be made."}
      - {term: CIF file, means: "The standard file for a crystal structure, readable by most chemistry software."}

help:
  - {q: "The Design page says the atomistic model needs setting up.", a: "UMA runs in its own Python, separate from the app. Point the CE_UMA_PYTHON setting at that Python and CE_UMA_CHECKPOINT at the model file (uma-s-1p1.pt), then reopen the app. On this computer both are already in place."}
  - {q: "The Materials Project search asks for a key.", a: "Sign in for free at materialsproject.org, copy your API key from your dashboard, and save it in the file ~/.config/.pmgrc.yaml as a line reading PMG_MAPI_KEY: your-key. Pure metals work in the meantime."}
  - {q: "A screen takes longer than I expected.", a: "Oxides and crystals with many atoms in their repeat unit take the longest. Choose Quick care, fewer materials, or a smaller \"Largest crystal cell\" in the search."}
  - {q: "A screen says it stopped early.", a: "Open it on the Results page; the message shows the last lines of its log. Finished materials keep their results. Start a new screen for the rest."}
  - {q: "A material has a note in the Details tab.", a: "On that spot the molecule drifted off the surface or split apart while the atoms settled. The ranking uses the other spots. Thorough care tries more spots."}
  - {q: "Two materials have nearly the same score.", a: "Look at their ranges. When the ranges overlap, the screen calls them a tie; rerun both on Thorough care, or test both in a lab."}
  - {q: "My reaction is outside the list.", a: "Add it on the Reactions page, under \"Add a reaction\". It takes about five minutes and the reaction shows up everywhere in the app right after."}
  - {q: "The app says a gas is outside its gas data.", a: "The reactor model knows the 53 small gases in the GRI-Mech 3.0 tables, which covers most gas-phase catalysis. Larger molecules need a thermodynamic data file; ask Claude to add one."}
  - {q: "How far can I trust the ranking?", a: "UMA matches published DFT binding energies to about 0.1 to 0.2 eV for metals (see Model accuracy), and the ranges carry that uncertainty. Treat the top of the list as the shortlist to test, and the order within overlapping ranges as open."}
  - {q: "Where are my screens saved?", a: "In data/screens inside the catalyst-engine folder: one folder per screen, with the settings, every binding energy, the structures as CIF files and a log."}
  - {q: "A page shows older numbers.", a: "Reload the page in your browser. The app reads fresh results each time."}
