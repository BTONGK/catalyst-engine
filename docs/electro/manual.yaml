tips:
  - Start with Quick care and a handful of metals; rerun the top three on Thorough.
  - Include the catalyst to beat's neighbours, such as palladium and iridium beside platinum, so the screen has known points to sit against.
  - Read the limiting step. Two materials with the same overpotential but different limiting steps call for different fixes.
  - A material whose intermediate split on every site binds too strongly to stay whole; it belongs on the strong-binding leg, with the Details tab showing where it broke.
  - Weigh supply and stability too. A surface that dissolves at the working potential works for a day; the Methodology tab says what the app leaves out.
  - A weak binder of oxygen high in an oxygen-reduction ranking, such as silver, needs a stability check at your pH and a check for hydrogen peroxide (Methodology, limits).
glossary:
  - group: Electrochemistry words
    terms:
      - {term: Electrocatalyst, means: "A catalyst that drives a reaction with electricity at an electrode in water, such as splitting water into hydrogen and oxygen."}
      - {term: Electrode, means: "The solid conductor where the reaction happens; the cathode takes electrons in, the anode gives them out."}
      - {term: Potential (V vs RHE), means: "The voltage of the electrode against the reversible hydrogen electrode, a scale on which hydrogen's own reaction sits at 0 V at any pH."}
      - {term: Equilibrium potential, means: "The voltage where a reaction's forward and backward rates balance: 0 V for hydrogen evolution, 1.23 V for the oxygen reactions."}
      - {term: Overpotential, means: "The extra voltage past the equilibrium potential a catalyst needs before the reaction runs. Smaller is better; it is paid as wasted energy."}
      - {term: Limiting potential, means: "The potential at which every step of the reaction's better route runs downhill on a given surface."}
      - {term: Route, means: "One way through a reaction's steps. Oxygen reduction has two: OOH* forms first, or O2 splits first; the faster carries the current."}
      - {term: Hurdle, means: "At a given potential, a route's largest step still uphill, or its chemical barrier when that is higher. Each tenth of an eV slows the route about fiftyfold."}
      - {term: Limiting step, means: "The step that stays uphill longest as the potential changes; the one a better material has to fix."}
      - {term: Intermediate, means: "A molecule fragment stuck to the surface part-way along the reaction path, such as OH* in oxygen reduction. The star marks a surface species."}
      - {term: Free-energy diagram, means: "The staircase of each intermediate's energy along the path; the potential tilts the whole staircase."}
      - {term: Computational hydrogen electrode, means: "The method that turns computed binding energies into electrode potentials by treating a proton and electron as half a hydrogen molecule (Nørskov 2004)."}
      - {term: Scaling relation, means: "The rule that intermediates' energies move together from surface to surface; OOH* sits about 3.2 eV above OH* in binding energy on almost every one."}
      - {term: Volcano, means: "The peaked curve of limiting potential against one intermediate's free energy that the scaling relations draw."}
      - {term: Exchange current, means: "The rate at which a reaction runs forward and back at its equilibrium potential; the measured yardstick for hydrogen evolution catalysts."}
      - {term: Hydrogen evolution (HER), means: "2 H+ + 2 e- -> H2, the cathode of water splitting."}
      - {term: Oxygen reduction (ORR), means: "O2 + 4 H+ + 4 e- -> 2 H2O, the fuel-cell cathode."}
      - {term: Oxygen evolution (OER), means: "2 H2O -> O2 + 4 H+ + 4 e-, the electrolyzer anode."}
  - group: App and model words
    terms:
      - {term: Screen, means: "One run over a list of materials for one reaction and one operating potential."}
      - {term: Catalyst to beat (reference), means: "The known catalyst every candidate is compared with; speeds are relative to it."}
      - {term: Key free energy (descriptor), means: "The intermediate's free energy that places a material on the volcano."}
      - {term: Likely range, means: "The lowest and highest value a prediction takes when every binding energy moves within its error bar, ±0.15 eV, at once."}
      - {term: How careful (care level), means: "How many surface spots the app tries per intermediate and how tightly the atoms settle."}
      - {term: UMA, means: "Universal Model for Atoms, Meta FAIR Chemistry's AI model of how atoms push and pull, trained on DFT results."}
      - {term: UMA mode, means: "Catalysis (trained on surfaces with molecules) suits metals and is the one checked here; materials (trained on bulk crystals) comes closest on oxides, still beyond the error bar."}
      - {term: DFT, means: "Density functional theory, the standard quantum-physics method for computing atoms' energies."}
      - {term: Materials Project, means: "A free online database of over 150,000 computed crystals, at materialsproject.org."}
help:
  - {q: "The Design page says the atomistic model needs setting up.", a: "UMA runs in its own Python, separate from the app. Point the CE_UMA_PYTHON setting at that Python and CE_UMA_CHECKPOINT at the model file (uma-s-1p1.pt), then reopen the app. On this computer both are already in place."}
  - {q: "The Materials Project search asks for a key.", a: "Sign in for free at materialsproject.org, copy your API key from your dashboard, and save it in the file ~/.config/.pmgrc.yaml as a line reading PMG_MAPI_KEY: your-key. Pure metals work in the meantime."}
  - {q: "A material shows as incomplete.", a: "An intermediate broke apart or drifted off at every site tried on that surface, so its path stays open. The Details tab shows each site. A molecule that splits binds too strongly to stay whole; one that drifts off binds too weakly to stay."}
  - {q: "The best material is one I would leave on the shelf.", a: "The ranking counts the steps of each route and, for oxygen reduction, the barrier to split O2 on the route that splits it; the surface's fate at the working potential sits outside it. Check a candidate's Pourbaix diagram at your potential and pH, treat the top of the list as the shortlist to test, and read the Methodology tab's limits."}
  - {q: "Silver ranks near the top for oxygen reduction. Should I trust it?", a: "Silver holds oxygen weakly, so splitting O2 on it costs about 1 eV, and its current takes the route through OOH*, where forming OOH* is its largest hurdle. On free energies alone that puts it third, as it does on Nørskov 2004's own numbers. Two things outside the free-energy picture weigh on it: in acid it dissolves above 0.80 V, and the route through OOH* can make hydrogen peroxide in place of water. The paper sets copper, silver and gold aside for this when it compares with experiment. Read silver as a lead for alkaline cells, where it keeps its metal surface up to about 1.17 V vs RHE, and measure how many electrons it moves per O2."}
  - {q: "How close is platinum's limiting potential to the papers?", a: "The app puts platinum at 0.79 V vs RHE, against the published 0.78 V. In the paper the last two steps on platinum sit 0.45 and 0.43 eV uphill at 1.23 V, essentially the same, and the first of them (O* to OH*) limits; on UMA's binding energies the second (OH* to water) limits, by a few hundredths of an eV. The app carries the paper's water term and its hydroxyl-layer term as constants; other metals' absolute values rest on those constants, and the order of the metals is what the checks confirm."}
  - {q: "Which potential should I compare at?", a: "The potential your device would run at: about -0.1 V for hydrogen evolution, 0.9 V for a fuel-cell cathode, 1.5 V for an electrolyzer anode. Limiting potentials and overpotentials read the same whatever you pick."}
