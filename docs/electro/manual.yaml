# The electrocatalysis manual: a primer on electrochemistry, the steps to use this section, its pages, tips,
# glossary and help. Written for everyday users, general to any electrochemical reaction.

preface:
  title: Electrochemistry basics
  intro: >
    An electrocatalyst drives a chemical reaction with electricity instead of heat. Water splits into hydrogen and
    oxygen when a voltage pushes electrons out of one electrode and into the other; a fuel cell runs the same
    chemistry backwards and gives the electricity back. The catalyst on each electrode decides how much extra
    voltage the reaction costs. This section of the app ranks materials by that cost.
  sections:
    - title: Potentials, and why they are measured against hydrogen
      paragraphs:
        - >
          Every electrochemical reaction has an equilibrium potential: the voltage where its forward and backward
          reactions balance. Hydrogen evolution sits at 0 V and the oxygen reactions at 1.23 V. The app states
          every potential against the reversible hydrogen electrode (RHE), a scale on which hydrogen's own reaction
          sits at 0 V whatever the pH, so the numbers read the same in acid and in alkali.
        - >
          A real electrode needs extra voltage past equilibrium before the reaction runs at a useful rate. That
          extra is the overpotential. It is paid as wasted energy, so a better catalyst means a smaller one.
    - title: The reaction path and its intermediates
      paragraphs:
        - >
          An electrochemical reaction moves one proton and one electron at a time. Between those moves the surface
          holds fragments of the molecule, the intermediates: adsorbed hydrogen for hydrogen evolution, OOH*, O*
          and OH* for oxygen reduction. Each intermediate has a free energy on a given surface, and the path from
          start to finish is a staircase of those energies.
        - >
          Changing the potential tilts the staircase by one electron-volt per volt on every step that moves an
          electron. A reduction, such as oxygen reduction, runs further downhill as the potential drops; an
          oxidation, such as oxygen evolution, as it rises. The ideal catalyst has every step the same size, so the
          whole staircase levels out together at the equilibrium potential. A real surface holds some intermediate
          too tightly or too loosely, one step stays uphill longer than the rest, and that step sets the limiting
          potential: the voltage at which every step finally runs downhill.
        - >
          Some reactions have more than one path. Oxygen reduction can turn O2 into OOH* first, or split O2 on the
          surface into two O* first and go on from there. Splitting is a chemical step with an energy barrier, and
          that barrier grows as the surface holds oxygen more weakly. Both routes run side by side, and the faster
          one carries the current.
      points:
        - Overpotential = the distance between the limiting potential and the equilibrium potential.
        - The limiting step is the one to fix; a better material changes how it holds that intermediate.
        - At a given potential, a route runs at the pace of its largest hurdle; every tenth of an eV of hurdle slows it about fiftyfold at room temperature.
    - title: The volcano and the scaling relations
      paragraphs:
        - >
          Surfaces that hold one intermediate tightly tend to hold the others tightly too: the energies scale
          together. For the oxygen reactions, OOH* sits a nearly fixed 3.2 eV above OH* in binding energy on almost
          every surface (Man 2011), where the ideal catalyst would put it 2.46 eV above, so one number, such as the
          OH* free energy, places a material on a volcano of limiting potential. The top of the volcano is as good as
          the scaling allows; a surface that breaks the scaling can climb higher, which is where new catalysts come
          from.
    - title: What the app computes, and what it leaves out
      paragraphs:
        - >
          The app computes each intermediate's binding energy on each material's surface with Meta's UMA model,
          turns it into a free energy with published corrections, and reads the limiting potential, the
          overpotential and a speed at your potential off the staircase. For oxygen reduction it follows both
          routes, the one through OOH* and the one that splits O2 first, whose barrier follows how strongly the
          surface holds oxygen, and takes the faster. That is the picture the field uses to rank candidates.
        - >
          Barriers of the proton transfers, the exact structure of the water layer, the way a surface oxidizes or
          dissolves at a working potential, and hydrogen peroxide as a side product stay outside it. The Methodology tab sizes each of those and says what
          to do meanwhile.

title: How to use this section
intro: >
  You tell the app what the electrode should do and which materials to try; it computes the free-energy staircase
  of each one and ranks them by the voltage they need. A screen of ten metals takes under an hour on this
  computer and runs in the background.
needs:
  - This app running on a computer with the atomistic model (UMA) set up; the Home page shows a green check when it is.
  - "Optional: a free Materials Project API key, to search 150,000+ crystals for alloys. Pure metals work right away."
steps:
  - phase: Set up the design
    title: Pick a reaction and a potential
    page: Design an electrocatalyst → 1 and 2
    image: step-design.png
    do:
      - Click "Design an electrocatalyst" in the menu on the left.
      - "In part 1, pick hydrogen evolution (making hydrogen) or oxygen reduction (a fuel-cell cathode). The page shows the reaction, its intermediates and routes, the catalyst to beat and the free energy that places each material on the volcano; \"Why this works\" explains the choice. Oxygen evolution (an electrolyzer anode) runs in the Free-energy playground until UMA passes its oxide check."
      - "In part 2, set the potential to compare catalysts at, in volts vs RHE. The text under the slider says how far that is from the equilibrium potential. Each material's limiting potential and overpotential read the same whatever you choose here; the speeds, and the ranking that sorts by them, depend on it."
    get: The reaction, the catalyst every material is compared with, and the operating potential.
  - phase: Set up the design
    title: Choose materials and start
    page: Design an electrocatalyst → 3 and 4
    do:
      - "Part 3: tick pure metals and press \"Add these metals\", or search the Materials Project by element and kind and add the rows you tick. Remove a material by ticking its Remove box. Metals and alloys are what the checks cover; oxides carry a larger error in every UMA mode (Methodology, limits)."
      - "Part 4: pick the care level (Quick, Standard, Thorough), name the screen and press \"Start the screen\". The estimate under the button says how long it will take."
      - "Each reaction starts in UMA's catalysis mode, the one checked on metal surfaces. Advanced lets you change the mode, the faces, the slab size and the catalyst to beat."
    get: A screen running in the background; the Results page opens on it.
  - phase: Read the results
    title: Read the ranking
    page: Electrocatalyst results → Ranking
    image: step-results.png
    do:
      - The headline shows the top-ranked candidate's overpotential (smaller is better), its limiting potential, its speed against the catalyst to beat at your potential, and its supply.
      - "The Ranking tab sorts by speed at your potential, then by overpotential. It lists every material with its overpotential, limiting potential and likely range, the step and route that limit it, the faster route at your potential, its speed and speed range, each intermediate's free energy, its stability and its supply."
      - "Read the ranking as a shortlist. Materials whose likely ranges overlap are a close call."
    get: A ranking by predicted speed, with the numbers behind it.
  - phase: Read the results
    title: Read the diagram, the activity and the volcano
    page: Electrocatalyst results → other tabs
    do:
      - "Free-energy diagram: pick a material and the potentials to draw at. The staircase tilts as the potential changes; the step that stays uphill longest is the one to fix."
      - "Activity vs potential: each material's speed against the catalyst to beat across potentials, with the ideal catalyst dashed. Lines meet at 1 where both run every step downhill."
      - "Volcano: each material's limiting potential against its key free energy, the line the scaling relations draw, and the equilibrium potential as the ceiling (reduction) or floor (oxidation)."
      - "3D structures: the clean surface and every intermediate on every site tried. Details: every site with its binding energy, and CSV downloads."
    get: The picture behind each number, and the step a better material has to change.
  - phase: Go further
    title: Try the free-energy playground
    page: Free-energy playground
    do:
      - Pick a reaction and move each intermediate's free energy by hand; the limiting potential, the overpotential, the route, the diagram and the dot on the volcano follow. Oxygen evolution runs here on free energies you enter, such as published DFT values.
      - Press "Set the ideal catalyst" to see the level staircase every real surface is measured against.
    get: A feel for which step costs the most voltage, before you run a screen.
