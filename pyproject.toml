[project]
name = "catalyst-engine"
version = "0.1.0"
description = "Closed-loop catalyst discovery engine: reaction packs, kinetics, fitting, planning, provenance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "cantera>=3.1",
    "typer>=0.15",
    "streamlit>=1.50",
]

[project.scripts]
ce = "catalyst_engine.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalyst_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
